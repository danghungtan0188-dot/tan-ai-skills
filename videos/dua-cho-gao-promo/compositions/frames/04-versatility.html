      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      var root = document.querySelector('[data-composition-id="04-versatility"]');

      tl.fromTo(

        { y: -10, opacity: 0 },

      function revealItem(index, popAt) {
        var item = root.querySelector(".v04-item-" + index);
        var marker = item.querySelector(".v04-marker");
        var pill = item.querySelector(".v04-pill");
        var text = item.querySelector(".v04-pill-text");

        tl.fromTo(
          marker,
          { scale: 0, opacity: 0, y: 8 },
          { scale: 1, opacity: 1, y: 0, duration: 0.3, ease: "power3.out" },
          popAt
        );

        var wipeStart = popAt + 0.25;
        var wipeDur = 0.4;
        var proxy = { p: 100 };
        tl.to(
          proxy,
          {
            p: 0,
            duration: wipeDur,
            ease: "power2.out",
            onUpdate: function () {
              pill.style.clipPath = "inset(0 " + proxy.p + "% 0 0 round 8px)";
            },
          },
          wipeStart
        );

        tl.fromTo(
          text,
          { x: 16, opacity: 0 },
          { x: 0, opacity: 1, duration: 0.3, ease: "power2.out" },
          wipeStart
        );
      }

      revealItem(1, 0.08);
      revealItem(2, 0.58);
      revealItem(3, 1.58);

      var idleStart = 2.1;
      var idleDur = 0.65;
      var period = 2.4;
      var floatPhase = { p: 0 };
      var item1 = root.querySelector(".v04-item-1");
      var item2 = root.querySelector(".v04-item-2");
      var item3 = root.querySelector(".v04-item-3");

      tl.to(
        floatPhase,

          p: (idleDur / period) * Math.PI * 2,
          duration: idleDur,
          ease: "none",
          onUpdate: function () {
            var s1 = Math.sin(floatPhase.p);
            var s2 = Math.sin(floatPhase.p + Math.PI / 3);
            var s3 = Math.sin(floatPhase.p + (Math.PI * 2) / 3);
