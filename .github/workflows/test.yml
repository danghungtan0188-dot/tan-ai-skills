# GitHub tự chạy toàn bộ test sau mỗi lần push hoặc mở PR vào main.
# Chạy trên máy chủ của GitHub, không dùng tài nguyên máy cá nhân.
name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Như máy làm việc thật: Python đọc/ghi tiếng Việt bằng UTF-8
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  test:
    # Windows như máy làm việc thật: script dùng font C:/Windows/Fonts/arial.ttf
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Cài ffmpeg
        run: choco install ffmpeg -y --no-progress

      - name: Cài thư viện Python mà test dùng
        run: pip install pillow numpy opencv-python-headless jsonschema defusedxml fonttools brotli

      - name: Chạy test
        run: python -m unittest discover -s tests

  typescript:
    # tsc không ép thì lỗi kiểu (như Root.tsx từng lỗi) lọt qua mà không ai biết
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        thu_muc: [do-hoa, remotion-studio]
    defaults:
      run:
        working-directory: ${{ matrix.thu_muc }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ${{ matrix.thu_muc }}/package-lock.json

      - name: Cài thư viện đúng theo lockfile
        run: npm ci --no-audit --no-fund

      - name: Kiểm kiểu TypeScript
        run: npx tsc --noEmit -p .
