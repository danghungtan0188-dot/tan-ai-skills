# GitHub tự chạy toàn bộ test sau mỗi lần push hoặc mở PR vào main.
# Chạy trên máy chủ của GitHub, không dùng tài nguyên máy cá nhân.
name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    # Windows như máy làm việc thật: script dùng font C:/Windows/Fonts/arial.ttf
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Cài ffmpeg
        run: choco install ffmpeg -y --no-progress

      - name: Cài thư viện Python mà test dùng
        run: pip install pillow numpy opencv-python-headless jsonschema defusedxml

      - name: Chạy test
        run: python -m unittest discover -s tests
