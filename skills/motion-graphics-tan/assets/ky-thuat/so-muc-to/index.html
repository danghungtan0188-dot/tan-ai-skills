      /* So muc to: so thu tu rat lon mau nhan + ten muc, dat tren dau nguoi noi. Dung khi chia video thanh cac buoc. */
      :root { --nen: #8a8f96; --trang: #ffffff; --vang: #ffd43b; --vien: #111111; --font: 'Montserrat VN', sans-serif; }
      * { margin: 0; padding: 0; box-sizing: border-box; }

      #sm-so { position: absolute; left: 0; top: 0; padding: 18px 36px 10px; border-radius: 36px; background: var(--vien);

  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1080" data-height="1920">
      <div id="sm-khoi" class="clip" data-start="0" data-duration="3" data-track-index="1">
        <div id="sm-so" data-var-text="so">01</div>
        <div id="sm-gach"></div>
        <div id="sm-ten" data-var-text="ten-muc">Cảnh đẹp nhất lên trước</div>
        <div id="sm-giai" data-var-text="giai-thich">Bán xoài thì mở bằng cảnh bổ trái chín</div>
      </div>
    </div>
    <script>
      // So dap xuong (scale 1,6 -> 1), gach chay ra, ten muc truot len. Tong cong vao xong trong 0,7 s.
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#sm-so", { scale: 1.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "power4.out" }, 0.05)
        .fromTo("#sm-gach", { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power3.out" }, 0.25)
        .fromTo("#sm-ten", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power3.out" }, 0.35)
        .fromTo("#sm-giai", { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power2.out" }, 0.5)
        .to("#sm-khoi", { y: -40, opacity: 0, duration: 0.25, ease: "power2.in" }, 2.7);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
