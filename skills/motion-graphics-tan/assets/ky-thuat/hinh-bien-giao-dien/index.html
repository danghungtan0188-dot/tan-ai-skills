<!doctype html>
<html lang="vi" data-resolution="portrait"
  data-composition-variables='[{"id":"nut","type":"string","label":"Chữ trên nút","default":"Đặt lịch ngay"},{"id":"ket-qua","type":"string","label":"Dòng kết quả","default":"Đã nhận lịch!"},{"id":"chi-tiet","type":"string","label":"Dòng chi tiết","default":"Thứ Bảy · 9:00 sáng"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: 'Montserrat VN'; font-style: italic; font-weight: 400 900; src: url('assets/fonts/montserrat-vn-italic-vietnamese.woff2') format('woff2'); unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB; }
      @font-face { font-family: 'Montserrat VN'; font-style: italic; font-weight: 400 900; src: url('assets/fonts/montserrat-vn-italic-latin-ext.woff2') format('woff2'); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF; }
      @font-face { font-family: 'Montserrat VN'; font-style: italic; font-weight: 400 900; src: url('assets/fonts/montserrat-vn-italic-latin.woff2') format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
      @font-face { font-family: 'Montserrat VN'; font-style: normal; font-weight: 400 900; src: url('assets/fonts/montserrat-vn-normal-vietnamese.woff2') format('woff2'); unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB; }
      @font-face { font-family: 'Montserrat VN'; font-style: normal; font-weight: 400 900; src: url('assets/fonts/montserrat-vn-normal-latin-ext.woff2') format('woff2'); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF; }
      @font-face { font-family: 'Montserrat VN'; font-style: normal; font-weight: 400 900; src: url('assets/fonts/montserrat-vn-normal-latin.woff2') format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
      /* Hinh bien giao dien: MOT khoi duy nhat, khong cat canh, doi hinh nut -> vong tai -> dau tich -> the ket qua.
         Doi hinh bang clip-path inset (khong tween width/height), noi dung ben trong doi sau khi khung bat dau doi.
         Hoc cach lam tu nhom prompt "mot hinh bien qua nhieu trang thai giao dien" (references/hoc-tu-prompt-opus.md). */
      :root { --nen: #8a8f96; --muc: #1c1712; --trang: #f7f1e8; --cam: #ff8a3d; --ngoc: #13867e; --font: 'Montserrat VN', sans-serif; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--nen); }
      #root { position: relative; width: 100%; height: 100%; font-family: var(--font); }
      #hb-khung { position: absolute; left: 140px; top: 270px; width: 800px; height: 800px; }
      #hb-hinh { position: absolute; inset: 0; background: var(--cam); clip-path: inset(320px 100px 320px 100px round 80px); }
      .hb-noi { position: absolute; left: 0; right: 0; text-align: center; opacity: 0; }
      #hb-nut { top: 362px; font-size: 56px; font-weight: 800; color: var(--muc); }
      #hb-vong { left: 345px; right: auto; top: 345px; width: 110px; height: 110px; border-radius: 50%;
        border: 12px solid rgba(28, 23, 18, 0.25); border-top-color: var(--muc); }
      #hb-tich { left: 368px; right: auto; top: 330px; width: 64px; height: 120px; border-right: 20px solid var(--trang);
        border-bottom: 20px solid var(--trang); border-radius: 4px; transform: rotate(45deg); }
      #hb-ket-qua { top: 290px; font-size: 76px; font-weight: 900; color: var(--trang); }
      #hb-chi-tiet { top: 410px; font-size: 48px; font-weight: 600; color: var(--trang); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1080" data-height="1920">
      <div id="hb-khung" class="clip" data-start="0" data-duration="5" data-track-index="1">
        <div id="hb-hinh"></div>
        <div id="hb-nut" class="hb-noi" data-var-text="nut">Đặt lịch ngay</div>
        <div id="hb-vong" class="hb-noi"></div>
        <div id="hb-tich" class="hb-noi"></div>
        <div id="hb-ket-qua" class="hb-noi" data-var-text="ket-qua">Đã nhận lịch!</div>
        <div id="hb-chi-tiet" class="hb-noi" data-var-text="chi-tiet">Thứ Bảy · 9:00 sáng</div>
      </div>
    </div>
    <script>
      // Nut (0-1,1 s, nhan nhe o 0,8 s) -> vong tron tai (1,1-2 s) -> tich xanh (2-2,8 s) -> the ket qua (2,8-5 s, giu 2 s).
      // Moi lan doi: noi dung cu ra (0,12 s) truoc, khung doi hinh (0,35 s), noi dung moi vao sau khi khung da doi duoc mot nua.
      const tl = gsap.timeline({ paused: true });
      const hinh = "#hb-hinh";
      tl.fromTo(hinh, { scale: 0.85, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(1.6)" }, 0)
        .fromTo("#hb-nut", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "none" }, 0.15)
        .to(["#hb-hinh", "#hb-nut"], { scale: 0.94, duration: 0.1, ease: "power1.out", yoyo: true, repeat: 1 }, 0.8)
        // -> vong tai
        .to("#hb-nut", { opacity: 0, duration: 0.12, ease: "none" }, 1.0)
        .to(hinh, { clipPath: "inset(320px 320px 320px 320px round 80px)", duration: 0.35, ease: "power3.inOut" }, 1.1)
        .to("#hb-vong", { opacity: 1, duration: 0.15, ease: "none" }, 1.3)
        .fromTo("#hb-vong", { rotation: 0 }, { rotation: 540, duration: 0.7, ease: "none" }, 1.3)
        // -> tich xanh
        .to("#hb-vong", { opacity: 0, duration: 0.12, ease: "none" }, 1.95)
        .to(hinh, { backgroundColor: "#13867e", duration: 0.25, ease: "none" }, 2.0)
        .fromTo("#hb-tich", { scale: 0.4, rotation: 45, opacity: 0 }, { scale: 1, rotation: 45, opacity: 1, duration: 0.3, ease: "back.out(2)" }, 2.05)
        // -> the ket qua
        .to("#hb-tich", { opacity: 0, duration: 0.12, ease: "none" }, 2.75)
        .to(hinh, { clipPath: "inset(200px 40px 280px 40px round 40px)", duration: 0.4, ease: "power3.inOut" }, 2.8)
        .fromTo("#hb-ket-qua", { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.25, ease: "power3.out" }, 3.0)
        .fromTo("#hb-chi-tiet", { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.25, ease: "power3.out" }, 3.0);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
