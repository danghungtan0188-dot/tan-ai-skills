<!doctype html>
<html lang="vi" data-resolution="landscape"
  data-composition-variables='[{"id": "nhan", "type": "string", "label": "Nhãn", "default": "TIN NHANH"}, {"id": "noi-dung", "type": "string", "label": "Nội dung chạy", "default": "Hợp tác xã Rau sạch An Thạnh xuất bán 12 tấn rau trong tháng 11   •   Xã An Thạnh Thủy khai trương chợ nông sản cuối tuần   •   Lịch phát sóng bản tin: 19 giờ 10 thứ bảy hằng tuần"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: 'Montserrat VN'; font-style: normal; font-weight: 400 900; src: url('assets/fonts/montserrat-vn-normal-vietnamese.woff2') format('woff2'); unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB; }
      @font-face { font-family: 'Montserrat VN'; font-style: normal; font-weight: 400 900; src: url('assets/fonts/montserrat-vn-normal-latin-ext.woff2') format('woff2'); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF; }
      @font-face { font-family: 'Montserrat VN'; font-style: normal; font-weight: 400 900; src: url('assets/fonts/montserrat-vn-normal-latin.woff2') format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
      /* Bang chu chay day man hinh: bang vao 0,4 s, chu chay deu toc do khong doi, ra 0,3 s. */
      :root { --nen: #8a8f96; --navy: #00164E; --navy2: #0A3C92; --vang: #FFCD2D; --trang: #ffffff; --den: #0b0f1a; --do: #CE2027; --xanh: #007A3D; --lam: #1A3CAA; --font: 'Montserrat VN', sans-serif; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--nen); }
      #root { position: relative; width: 100%; height: 100%; font-family: var(--font); }
      #cc { position: absolute; left: 0; right: 0; top: 944px; height: 78px; }
      #cc-nen { position: absolute; left: 0; right: 0; top: 0; bottom: 0; background: var(--navy); border-top: 4px solid var(--vang); }
      #cc-khung { position: absolute; left: 420px; right: 96px; top: 4px; bottom: 0; overflow: hidden; }
      #cc-chu { position: absolute; left: 0; top: 0; height: 74px; display: flex; align-items: center; white-space: nowrap;
        font-size: 36px; font-weight: 700; color: var(--trang); }
      #cc-nhan-hop { position: absolute; left: 0; top: -14px; width: 400px; height: 92px; display: flex; align-items: center; padding-left: 100px;
        background: var(--do); clip-path: polygon(0 0, 100% 0, 88% 100%, 0 100%); }
      #cc-nhan { font-size: 38px; font-weight: 900; color: var(--trang); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <div id="cc" class="clip" data-start="0" data-duration="6" data-track-index="1" data-layout-allow-overflow>
        <div id="cc-nen"></div>
        <div id="cc-khung"><div id="cc-chu" data-var-text="noi-dung">Hợp tác xã Rau sạch An Thạnh xuất bán 12 tấn rau trong tháng 11   •   Xã An Thạnh Thủy khai trương chợ nông sản cuối tuần   •   Lịch phát sóng bản tin: 19 giờ 10 thứ bảy hằng tuần</div></div>
        <div id="cc-nhan-hop"><div id="cc-nhan" data-var-text="nhan">TIN NHANH</div></div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#cc-nen", { scaleX: 0, transformOrigin: "left center" }, { scaleX: 1, duration: 0.4, ease: "power3.out" }, 0)
        .fromTo("#cc-nhan-hop", { x: -420 }, { x: 0, duration: 0.35, ease: "power3.out" }, 0.1)
        // Chay deu 300 px/giay: tu mep phai khung (1404 px) sang trai.
        .fromTo("#cc-chu", { x: 1404 }, { x: 1404 - 300 * 5.3, duration: 5.3, ease: "none" }, 0.4)
        .to("#cc", { y: 120, duration: 0.3, ease: "power2.in" }, 5.7);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
