<!doctype html>
<html lang="vi" data-resolution="landscape"
  data-composition-variables='[{"id": "tieu-de", "type": "string", "label": "Tiêu đề", "default": "THỰC HIỆN"}, {"id": "dong-1", "type": "string", "label": "Dòng 1", "default": "Biên tập: Đặng Hùng Tân"}, {"id": "dong-2", "type": "string", "label": "Dòng 2", "default": "Quay phim: Nguyễn Minh Khoa"}, {"id": "dong-3", "type": "string", "label": "Dòng 3", "default": "Dựng hình: ATT NEWS"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: 'Montserrat VN'; font-style: normal; font-weight: 400 900; src: url('assets/fonts/montserrat-vn-normal-vietnamese.woff2') format('woff2'); unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB; }
      @font-face { font-family: 'Montserrat VN'; font-style: normal; font-weight: 400 900; src: url('assets/fonts/montserrat-vn-normal-latin-ext.woff2') format('woff2'); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF; }
      @font-face { font-family: 'Montserrat VN'; font-style: normal; font-weight: 400 900; src: url('assets/fonts/montserrat-vn-normal-latin.woff2') format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
      /* E-kip cuoi phong su: nen toi mo, cac dong hien lan luot giua khung, dung yen. */
      :root { --nen: #8a8f96; --navy: #00164E; --navy2: #0A3C92; --vang: #FFCD2D; --trang: #ffffff; --den: #0b0f1a; --do: #CE2027; --xanh: #007A3D; --lam: #1A3CAA; --font: 'Montserrat VN', sans-serif; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--nen); }
      #root { position: relative; width: 100%; height: 100%; font-family: var(--font); }
      #ek { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; background: linear-gradient(180deg, #000818 0%, var(--navy) 100%); }
      #ek-tieu { position: absolute; left: 0; right: 0; top: 300px; text-align: center; font-size: 48px; font-weight: 900; color: var(--vang); }
      #ek-gach { position: absolute; left: 900px; top: 375px; width: 120px; height: 6px; border-radius: 3px; background: var(--vang); }
      .ek-dong { position: absolute; left: 0; right: 0; text-align: center; font-size: 46px; font-weight: 700; color: var(--trang); }
      #ek-1 { top: 440px; } #ek-2 { top: 530px; } #ek-3 { top: 620px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <div id="ek" class="clip" data-start="0" data-track-index="1" data-duration="6">
        <div id="ek-tieu" data-var-text="tieu-de">THỰC HIỆN</div>
        <div id="ek-gach"></div>
        <div class="ek-dong" id="ek-1" data-var-text="dong-1">Biên tập: Đặng Hùng Tân</div>
        <div class="ek-dong" id="ek-2" data-var-text="dong-2">Quay phim: Nguyễn Minh Khoa</div>
        <div class="ek-dong" id="ek-3" data-var-text="dong-3">Dựng hình: ATT NEWS</div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#ek", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0)
        .fromTo("#ek-tieu", { y: -20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power2.out" }, 0.2)
        .fromTo("#ek-gach", { scaleX: 0 }, { scaleX: 1, duration: 0.3 }, 0.45)
        .fromTo(".ek-dong", { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power2.out", stagger: 0.35 }, 0.6)
        .to("#ek", { opacity: 0, duration: 0.5 }, 5.5);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
