<!doctype html>
<html lang="vi" data-resolution="landscape"
  data-composition-variables='[{"id": "ten", "type": "string", "label": "Tên người", "default": "Nguyễn Văn An"}, {"id": "chuc-vu", "type": "string", "label": "Chức vụ", "default": "Giám đốc Hợp tác xã Rau sạch An Thạnh"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: 'Montserrat VN'; font-style: normal; font-weight: 400 900; src: url('assets/fonts/montserrat-vn-normal-vietnamese.woff2') format('woff2'); unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB; }
      @font-face { font-family: 'Montserrat VN'; font-style: normal; font-weight: 400 900; src: url('assets/fonts/montserrat-vn-normal-latin-ext.woff2') format('woff2'); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF; }
      @font-face { font-family: 'Montserrat VN'; font-style: normal; font-weight: 400 900; src: url('assets/fonts/montserrat-vn-normal-latin.woff2') format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
      /* Lower-third dai: dat o 65,5% chieu cao nhu luat ATT, vao xong trong 0,8 s, ra 0,3 s. */
      :root { --nen: #8a8f96; --navy: #00164E; --navy2: #0A3C92; --vang: #FFCD2D; --trang: #ffffff; --den: #0b0f1a; --do: #CE2027; --xanh: #007A3D; --lam: #1A3CAA; --font: 'Montserrat VN', sans-serif; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--nen); }
      #root { position: relative; width: 100%; height: 100%; font-family: var(--font); }
      #lt { position: absolute; left: 110px; top: 707px; width: 1240px; height: 190px; }
      #lt-vach { position: absolute; left: 0; top: 0; width: 16px; height: 190px; background: var(--vang); transform-origin: center bottom; }
      #lt-ten-hop { position: absolute; left: 16px; top: 0; height: 104px; padding: 0 44px; display: flex; align-items: center;
        background: linear-gradient(90deg, var(--navy) 0%, var(--navy2) 100%); }
      #lt-ten { font-size: 58px; font-weight: 900; color: var(--trang); white-space: nowrap; }
      #lt-cv-hop { position: absolute; left: 16px; top: 104px; height: 70px; padding: 0 44px; display: flex; align-items: center; background: var(--den); }
      #lt-cv { font-size: 34px; font-weight: 700; color: var(--vang); white-space: nowrap; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1920" data-height="1080">
      <div id="lt" class="clip" data-start="0" data-duration="5" data-track-index="1">
        <div id="lt-vach"></div>
        <div id="lt-ten-hop"><div id="lt-ten" data-var-text="ten">Nguyễn Văn An</div></div>
        <div id="lt-cv-hop"><div id="lt-cv" data-var-text="chuc-vu">Giám đốc Hợp tác xã Rau sạch An Thạnh</div></div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#lt-vach", { scaleY: 0 }, { scaleY: 1, duration: 0.25, ease: "power3.out" }, 0.05)
        .fromTo("#lt-ten-hop", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.4, ease: "power3.out" }, 0.2)
        .fromTo("#lt-ten", { x: -30, opacity: 0 }, { x: 0, opacity: 1, duration: 0.35, ease: "power2.out" }, 0.35)
        .fromTo("#lt-cv-hop", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.35, ease: "power3.out" }, 0.45)
        .fromTo("#lt-cv", { x: -20, opacity: 0 }, { x: 0, opacity: 1, duration: 0.3, ease: "power2.out" }, 0.55)
        .to("#lt", { x: -60, opacity: 0, duration: 0.3, ease: "power2.in" }, 4.65);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
