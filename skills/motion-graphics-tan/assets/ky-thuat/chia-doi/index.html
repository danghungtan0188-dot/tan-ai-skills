<!doctype html>
<html lang="vi" data-resolution="portrait"
  data-composition-variables='[{"id":"buoc","type":"string","label":"Nhãn bước trên màn hình","default":"Bước 1: Tải clip lên"},{"id":"cho-nguoi","type":"string","label":"Chữ tạm ô người nói","default":"Người nói"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: 'Montserrat VN'; font-style: italic; font-weight: 400 900; src: url('assets/fonts/montserrat-vn-italic-vietnamese.woff2') format('woff2'); unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB; }
      @font-face { font-family: 'Montserrat VN'; font-style: italic; font-weight: 400 900; src: url('assets/fonts/montserrat-vn-italic-latin-ext.woff2') format('woff2'); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF; }
      @font-face { font-family: 'Montserrat VN'; font-style: italic; font-weight: 400 900; src: url('assets/fonts/montserrat-vn-italic-latin.woff2') format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
      @font-face { font-family: 'Montserrat VN'; font-style: normal; font-weight: 400 900; src: url('assets/fonts/montserrat-vn-normal-vietnamese.woff2') format('woff2'); unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB; }
      @font-face { font-family: 'Montserrat VN'; font-style: normal; font-weight: 400 900; src: url('assets/fonts/montserrat-vn-normal-latin-ext.woff2') format('woff2'); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF; }
      @font-face { font-family: 'Montserrat VN'; font-style: normal; font-weight: 400 900; src: url('assets/fonts/montserrat-vn-normal-latin.woff2') format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
      /* Chia doi: nua tren la man hinh may (buoc dang lam), nua duoi la nguoi noi trong khung bo goc, ca hai tren nen hoa tiet.
         Hoc tu Quizzy (video huong dan thao tac). Thay #cd-man va #cd-nguoi bang clip that khi dung. */
      :root { --nen: #8a8f96; --nen-hoa: #1e2a30; --cham: #2c3d45; --man: #f4f6f7; --thanh: #d6dde0; --nhan: #ffd43b; --muc: #14191c;
        --font: 'Montserrat VN', sans-serif; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--nen); }
      #root { position: relative; width: 100%; height: 100%; font-family: var(--font); }
      #cd-nen { position: absolute; inset: 0; background-color: var(--nen-hoa);
        background-image: radial-gradient(var(--cham) 6px, transparent 7px); background-size: 56px 56px; }
      #cd-man { position: absolute; left: 70px; top: 180px; width: 940px; height: 600px; border-radius: 28px; background: var(--man); overflow: hidden; }
      #cd-thanh-tieu-de { position: absolute; left: 0; right: 0; top: 0; height: 64px; background: var(--thanh); }
      .cd-cham { position: absolute; top: 22px; width: 20px; height: 20px; border-radius: 50%; background: #9aa5aa; }
      .cd-dong { position: absolute; left: 50px; height: 34px; border-radius: 17px; background: var(--thanh); transform-origin: left center; }
      #cd-buoc { position: absolute; left: 70px; top: 810px; padding: 14px 32px; border-radius: 40px; background: var(--nhan);
        font-size: 48px; font-weight: 800; color: var(--muc); }
      #cd-nguoi { position: absolute; left: 190px; top: 930px; width: 700px; height: 820px; border-radius: 40px;
        background: linear-gradient(170deg, #45545b, #263035); display: flex; align-items: center; justify-content: center;
        color: #e6ecee; font-size: 46px; font-weight: 700; border: 8px solid #fff; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4" data-width="1080" data-height="1920">
      <div id="cd-nen" class="clip" data-start="0" data-duration="4" data-track-index="1">
        <div id="cd-man">
          <div id="cd-thanh-tieu-de"></div>
          <div class="cd-cham" style="left: 26px"></div><div class="cd-cham" style="left: 58px"></div><div class="cd-cham" style="left: 90px"></div>
          <div class="cd-dong" style="top: 120px; width: 620px"></div>
          <div class="cd-dong" style="top: 190px; width: 820px"></div>
          <div class="cd-dong" style="top: 260px; width: 540px"></div>
          <div class="cd-dong" style="top: 360px; width: 760px"></div>
          <div class="cd-dong" style="top: 430px; width: 480px"></div>
        </div>
        <div id="cd-buoc" data-var-text="buoc">Bước 1: Tải clip lên</div>
        <div id="cd-nguoi" data-var-text="cho-nguoi">Người nói</div>
      </div>
    </div>
    <script>
      // Man hinh tha xuong, cac dong noi dung chay ra nhu dang tai, nhan buoc bat ra; o nguoi noi truot len tu duoi.
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#cd-man", { y: -120, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "power3.out" }, 0)
        .fromTo("#cd-nguoi", { y: 200, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "power3.out" }, 0.1)
        .fromTo(".cd-dong", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power2.out", stagger: 0.12 }, 0.4)
        .fromTo("#cd-buoc", { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(2.5)" }, 0.7);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
