<!doctype html>
<html lang="vi" data-resolution="portrait"
  data-composition-variables='[{"id":"diem","type":"string","label":"Điểm","default":"ĐIỂM 01200"},{"id":"tieu-de","type":"string","label":"Tiêu đề","default":"CẤP ĐỘ MỚI"},{"id":"phu","type":"string","label":"Dòng phụ","default":"Nhấn để bắt đầu"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: 'VT323 VN'; font-style: normal; font-weight: 400; src: url('assets/fonts/vt323-vn-normal-vietnamese.woff2') format('woff2'); unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB; }
      @font-face { font-family: 'VT323 VN'; font-style: normal; font-weight: 400; src: url('assets/fonts/vt323-vn-normal-latin-ext.woff2') format('woff2'); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF; }
      @font-face { font-family: 'VT323 VN'; font-style: normal; font-weight: 400; src: url('assets/fonts/vt323-vn-normal-latin.woff2') format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
      /* Pixel 8-bit: game cu -- khoi vuong, khong bo goc, mau it, chuyen dong giat theo buoc. Moi kich thuoc la boi so cua 20px. */
      :root { --nen: #8a8f96; --troi: #1c2a8c; --dat: #c84c0c; --co: #00a800; --vang: #fcbc3c; --trang: #fcfcfc; --den: #101010; --do: #d82800;
        --font: 'VT323 VN', monospace; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--nen); }
      #root { position: relative; width: 100%; height: 100%; font-family: var(--font); }
      #px-the { position: absolute; left: 140px; top: 170px; width: 800px; height: 1000px; overflow: hidden; background: var(--troi); }
      #px-diem { position: absolute; left: 40px; top: 30px; font-size: 56px; color: var(--trang); }
      #px-tieu-de { position: absolute; left: 0; right: 0; top: 150px; text-align: center; font-size: 150px; line-height: 1;
        color: var(--trang); text-shadow: 8px 8px 0 var(--den); }
      #px-phu { position: absolute; left: 0; right: 0; top: 310px; text-align: center; font-size: 64px; color: var(--vang);
        text-shadow: 4px 4px 0 var(--den); }
      .px-may { position: absolute; width: 160px; height: 40px; background: var(--trang); }
      .px-may::before { content: ""; position: absolute; left: 40px; top: -40px; width: 80px; height: 40px; background: var(--trang); }
      #px-m1 { left: 60px; top: 480px; } #px-m2 { left: 520px; top: 430px; }
      #px-co { position: absolute; left: 0; right: 0; top: 800px; height: 40px; background: var(--co); }
      #px-dat { position: absolute; left: 0; right: 0; top: 840px; height: 160px; background: var(--dat);
        background-image: linear-gradient(var(--den) 4px, transparent 4px), linear-gradient(90deg, var(--den) 4px, transparent 4px);
        background-size: 80px 80px; }
      #px-gach { position: absolute; left: 440px; top: 560px; width: 80px; height: 80px; background: var(--vang); border: 8px solid var(--den); }
      #px-xu { position: absolute; left: 460px; top: 480px; width: 40px; height: 60px; background: var(--vang); border: 6px solid var(--den); }
      #px-nguoi { position: absolute; left: 200px; top: 680px; width: 80px; height: 120px; background: var(--do); }
      #px-dau { position: absolute; left: 10px; top: -40px; width: 60px; height: 50px; background: #fcb890; border-top: 16px solid var(--do); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1080" data-height="1920">
      <div id="px-the" class="clip" data-start="0" data-duration="3" data-track-index="1">
        <div id="px-m1" class="px-may"></div>
        <div id="px-m2" class="px-may"></div>
        <div id="px-xu"></div>
        <div id="px-gach"></div>
        <div id="px-co"></div>
        <div id="px-dat"></div>
        <div id="px-nguoi"><div id="px-dau"></div></div>
        <div id="px-diem" data-var-text="diem">ĐIỂM 01200</div>
        <div id="px-tieu-de" data-var-text="tieu-de">CẤP ĐỘ MỚI</div>
        <div id="px-phu" data-var-text="phu">Nhấn để bắt đầu</div>
      </div>
    </div>
    <script>
      // Chu ky chuyen dong: giat theo buoc (steps), khong chuyen tiep muot. Nhan vat nhay dap gach, xu bay len, chu nhap nhay nhu man hinh game.
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#px-the", { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "steps(1)" }, 0)
        .fromTo(".px-may", { x: 100 }, { x: -100, duration: 3, ease: "steps(30)" }, 0)
        .fromTo("#px-nguoi", { x: -280 }, { x: 240, duration: 0.8, ease: "steps(8)" }, 0.1)
        .to("#px-nguoi", { y: -80, duration: 0.2, ease: "steps(4)" }, 0.9)
        .to("#px-nguoi", { y: 0, duration: 0.2, ease: "steps(4)" }, 1.1)
        .to("#px-gach", { y: -20, duration: 0.1, ease: "steps(2)", yoyo: true, repeat: 1 }, 1.05)
        .fromTo("#px-xu", { y: 80, opacity: 0 }, { y: -40, opacity: 1, duration: 0.3, ease: "steps(6)" }, 1.05)
        .fromTo("#px-diem", { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "steps(1)" }, 0.2)
        .fromTo("#px-tieu-de", { y: -300 }, { y: 0, duration: 0.5, ease: "steps(10)" }, 0.25)
        .fromTo("#px-phu", { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "steps(1)" }, 0.8)
        .to("#px-phu", { opacity: 0.15, duration: 0.25, ease: "steps(1)", yoyo: true, repeat: 5 }, 1.2)
        .to("#px-the", { opacity: 0, duration: 0.1, ease: "steps(1)" }, 2.85);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
