<!doctype html>
<html lang="vi" data-resolution="portrait"
  data-composition-variables='[{"id":"tieu-de","type":"string","label":"Tiêu đề","default":"Ba bước đơn giản"},{"id":"buoc1","type":"string","label":"Bước 1","default":"Gửi tư liệu"},{"id":"buoc2","type":"string","label":"Bước 2","default":"Duyệt kế hoạch"},{"id":"buoc3","type":"string","label":"Bước 3","default":"Nhận video"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: 'Patrick Hand VN'; font-style: normal; font-weight: 400; src: url('assets/fonts/patrick-hand-vn-normal-vietnamese.woff2') format('woff2'); unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB; }
      @font-face { font-family: 'Patrick Hand VN'; font-style: normal; font-weight: 400; src: url('assets/fonts/patrick-hand-vn-normal-latin-ext.woff2') format('woff2'); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF; }
      @font-face { font-family: 'Patrick Hand VN'; font-style: normal; font-weight: 400; src: url('assets/fonts/patrick-hand-vn-normal-latin.woff2') format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
      /* Doodle ve tay: giay ke, chu viet tay, net but tu ve, tat ca rung nhe nhu hoat hinh ve tay (doi hinh moi 1/8 giay). */
      :root { --nen: #8a8f96; --giay: #fdfaf1; --ke: #cfe0ee; --but: #24303f; --do: #e4572e; --xanh: #2a9d8f;
        --font: 'Patrick Hand VN', cursive; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--nen); }
      #root { position: relative; width: 100%; height: 100%; font-family: var(--font); }
      #dd-the { position: absolute; left: 140px; top: 170px; width: 800px; height: 1000px; overflow: hidden; background-color: var(--giay);
        background-image: linear-gradient(var(--ke) 3px, transparent 3px); background-size: 100% 74px; border-radius: 10px; }
      #dd-tieu-de { position: absolute; left: 70px; top: 70px; font-size: 104px; line-height: 1.1; color: var(--but); }
      #dd-net { position: absolute; left: 0; top: 0; width: 800px; height: 1000px; }
      .dd-v { fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .dd-dong { position: absolute; left: 200px; font-size: 76px; line-height: 1; color: var(--but); }
      #dd-b1 { top: 322px; } #dd-b2 { top: 538px; } #dd-b3 { top: 754px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1080" data-height="1920">
      <div id="dd-the" class="clip" data-start="0" data-duration="3" data-track-index="1">
        <div id="dd-tieu-de" data-var-text="tieu-de">Ba bước đơn giản</div>
        <svg id="dd-net" viewBox="0 0 800 1000">
          <path id="dd-gach" class="dd-v" stroke="#e4572e" stroke-width="9" pathLength="1" d="M72 208 C 200 190, 380 226, 610 196" />
          <path id="dd-o1" class="dd-v" stroke="#24303f" stroke-width="7" pathLength="1" d="M80 300 C 140 292, 158 298, 156 362 C 154 402, 90 400, 82 396 C 74 360, 76 330, 80 300" />
          <path id="dd-o2" class="dd-v" stroke="#24303f" stroke-width="7" pathLength="1" d="M80 516 C 140 508, 158 514, 156 578 C 154 618, 90 616, 82 612 C 74 576, 76 546, 80 516" />
          <path id="dd-o3" class="dd-v" stroke="#24303f" stroke-width="7" pathLength="1" d="M80 732 C 140 724, 158 730, 156 794 C 154 834, 90 832, 82 828 C 74 792, 76 762, 80 732" />
          <path id="dd-t1" class="dd-v" stroke="#2a9d8f" stroke-width="12" pathLength="1" d="M94 346 L 114 378 L 168 288" />
          <path id="dd-t2" class="dd-v" stroke="#2a9d8f" stroke-width="12" pathLength="1" d="M94 562 L 114 594 L 168 504" />
          <path id="dd-t3" class="dd-v" stroke="#2a9d8f" stroke-width="12" pathLength="1" d="M94 778 L 114 810 L 168 720" />
          <path id="dd-sao" class="dd-v" stroke="#e4572e" stroke-width="7" pathLength="1" transform="translate(-30 660)" d="M690 90 L 708 138 L 760 140 L 720 170 L 734 220 L 690 192 L 648 220 L 660 170 L 620 140 L 672 138 Z" />
        </svg>
        <div id="dd-b1" class="dd-dong" data-var-text="buoc1">Gửi tư liệu</div>
        <div id="dd-b2" class="dd-dong" data-var-text="buoc2">Duyệt kế hoạch</div>
        <div id="dd-b3" class="dd-dong" data-var-text="buoc3">Nhận video</div>
      </div>
    </div>
    <script>
      // Chu ky chuyen dong: net but tu ve (strokeDashoffset) va rung "boil": lech rat nhe, doi vi tri moi 1/8 giay bang steps(1).
      const tl = gsap.timeline({ paused: true });
      gsap.set(".dd-v", { strokeDasharray: 1 });
      const ve = (chon, luc, dai) => tl.fromTo(chon, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: dai, ease: "power1.inOut" }, luc);
      tl.fromTo("#dd-the", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "none" }, 0)
        .fromTo("#dd-tieu-de", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "none" }, 0.1);
      ve("#dd-gach", 0.3, 0.35); ve("#dd-sao", 0.4, 0.5);
      ve("#dd-o1", 0.55, 0.25); ve("#dd-o2", 0.7, 0.25); ve("#dd-o3", 0.85, 0.25);
      tl.fromTo("#dd-b1", { x: -16, opacity: 0 }, { x: 0, opacity: 1, duration: 0.2, ease: "power1.out" }, 0.9);
      ve("#dd-t1", 1.0, 0.22);
      tl.fromTo("#dd-b2", { x: -16, opacity: 0 }, { x: 0, opacity: 1, duration: 0.2, ease: "power1.out" }, 1.3);
      ve("#dd-t2", 1.4, 0.22);
      tl.fromTo("#dd-b3", { x: -16, opacity: 0 }, { x: 0, opacity: 1, duration: 0.2, ease: "power1.out" }, 1.7);
      ve("#dd-t3", 1.8, 0.22);
      // Rung: 22 lan doi hinh, moi lan 0.125 giay, lech toi da 3px theo danh sach co dinh de render lai van giong het.
      const lech = [[2, -1], [-2, 2], [1, 2], [-1, -2], [3, 0], [-2, -1]];
      for (let i = 0; i < 22; i++) {
        const [x, y] = lech[i % lech.length];
        tl.set("#dd-net", { x, y, rotation: (i % 2 ? 0.25 : -0.25) }, i * 0.125);
      }
      tl.to("#dd-the", { opacity: 0, duration: 0.2, ease: "none" }, 2.78);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
