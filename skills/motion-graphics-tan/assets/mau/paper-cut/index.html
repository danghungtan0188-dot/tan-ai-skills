<!doctype html>
<html lang="vi" data-resolution="portrait"
  data-composition-variables='[{"id":"tieu-de","type":"string","label":"Tiêu đề","default":"Câu chuyện quê hương"},{"id":"phu","type":"string","label":"Dòng phụ","default":"Phim ngắn · Tập 1"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: 'Nunito VN'; font-style: normal; font-weight: 400 900; src: url('assets/fonts/nunito-vn-normal-vietnamese.woff2') format('woff2'); unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB; }
      @font-face { font-family: 'Nunito VN'; font-style: normal; font-weight: 400 900; src: url('assets/fonts/nunito-vn-normal-latin-ext.woff2') format('woff2'); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF; }
      @font-face { font-family: 'Nunito VN'; font-style: normal; font-weight: 400 900; src: url('assets/fonts/nunito-vn-normal-latin.woff2') format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
      /* Paper cut: giay cat lop -- nhieu lop mau dac xep chong, moi lop co bong do nhe len lop sau, tao chieu sau khong can 3D. */
      :root { --nen: #8a8f96; --troi: #fde8c8; --mat-troi: #f6a13a; --l1: #8fd3c1; --l2: #4fb3a1; --l3: #2a8a7d; --l4: #17594f;
        --giay: #fffaf0; --chu: #17594f; --font: 'Nunito VN', sans-serif; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--nen); }
      #root { position: relative; width: 100%; height: 100%; font-family: var(--font); }
      #pc-the { position: absolute; left: 140px; top: 170px; width: 800px; height: 1000px; overflow: hidden; background: var(--troi); border-radius: 8px; }
      #pc-troi { position: absolute; left: 480px; top: 300px; width: 190px; height: 190px; border-radius: 50%; background: var(--mat-troi);
        box-shadow: 0 8px 16px rgba(120, 70, 0, 0.3); }
      .pc-doi { position: absolute; border-radius: 50%; box-shadow: 0 -10px 22px rgba(10, 50, 45, 0.32); }
      #pc-d1 { left: -220px; top: 470px; width: 900px; height: 700px; background: var(--l1); }
      #pc-d2 { left: 200px; top: 570px; width: 980px; height: 700px; background: var(--l2); }
      #pc-d3 { left: -320px; top: 680px; width: 1000px; height: 700px; background: var(--l3); }
      #pc-d4 { left: 120px; top: 800px; width: 1100px; height: 700px; background: var(--l4); }
      #pc-bang { position: absolute; left: 60px; top: 60px; width: 680px; padding: 34px 40px; background: var(--giay);
        box-shadow: 0 12px 24px rgba(60, 40, 10, 0.3); border-radius: 6px; }
      #pc-tieu-de { font-size: 80px; font-weight: 900; line-height: 1.12; letter-spacing: -0.01em; color: var(--chu); }
      #pc-phu { margin-top: 16px; font-size: 38px; font-weight: 700; color: var(--l3); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1080" data-height="1920">
      <div id="pc-the" class="clip" data-start="0" data-duration="3" data-track-index="1">
        <div id="pc-troi"></div>
        <div id="pc-d1" class="pc-doi" data-layout-allow-overflow></div>
        <div id="pc-d2" class="pc-doi" data-layout-allow-overflow></div>
        <div id="pc-d3" class="pc-doi" data-layout-allow-overflow></div>
        <div id="pc-d4" class="pc-doi" data-layout-allow-overflow></div>
        <div id="pc-bang">
          <div id="pc-tieu-de" data-var-text="tieu-de">Câu chuyện quê hương</div>
          <div id="pc-phu" data-var-text="phu">Phim ngắn · Tập 1</div>
        </div>
      </div>
    </div>
    <script>
      // Chu ky chuyen dong: cac lop truot len lan luot nhu kich giay (lop gan vao sau, di nhieu hon), roi troi cham lech nhau (parallax).
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#pc-the", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "none" }, 0)
        .fromTo("#pc-troi", { y: 320 }, { y: 0, duration: 0.9, ease: "power2.out" }, 0.05)
        .fromTo("#pc-d1", { y: 300 }, { y: 0, duration: 0.7, ease: "power3.out" }, 0.1)
        .fromTo("#pc-d2", { y: 400 }, { y: 0, duration: 0.7, ease: "power3.out" }, 0.22)
        .fromTo("#pc-d3", { y: 500 }, { y: 0, duration: 0.7, ease: "power3.out" }, 0.34)
        .fromTo("#pc-d4", { y: 600 }, { y: 0, duration: 0.7, ease: "power3.out" }, 0.46)
        .fromTo("#pc-bang", { y: -320, rotation: -3, opacity: 0 }, { y: 0, rotation: 0, opacity: 1, duration: 0.7, ease: "back.out(1.5)" }, 0.6)
        .to("#pc-d1", { x: 14, duration: 1.7, ease: "none" }, 1.0)
        .to("#pc-d2", { x: -24, duration: 1.7, ease: "none" }, 1.0)
        .to("#pc-d3", { x: 36, duration: 1.7, ease: "none" }, 1.0)
        .to("#pc-d4", { x: -50, duration: 1.7, ease: "none" }, 1.0)
        .to("#pc-the", { opacity: 0, duration: 0.28, ease: "none" }, 2.68);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
