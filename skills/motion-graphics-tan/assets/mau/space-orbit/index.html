<!doctype html>
<html lang="vi" data-resolution="portrait"
  data-composition-variables='[{"id":"tieu-de","type":"string","label":"Tiêu đề","default":"Hành trình mới"},{"id":"phu","type":"string","label":"Dòng phụ","default":"Khởi hành tháng 12"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: 'Montserrat VN'; font-style: italic; font-weight: 400 900; src: url('assets/fonts/montserrat-vn-italic-vietnamese.woff2') format('woff2'); unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB; }
      @font-face { font-family: 'Montserrat VN'; font-style: italic; font-weight: 400 900; src: url('assets/fonts/montserrat-vn-italic-latin-ext.woff2') format('woff2'); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF; }
      @font-face { font-family: 'Montserrat VN'; font-style: italic; font-weight: 400 900; src: url('assets/fonts/montserrat-vn-italic-latin.woff2') format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
      @font-face { font-family: 'Montserrat VN'; font-style: normal; font-weight: 400 900; src: url('assets/fonts/montserrat-vn-normal-vietnamese.woff2') format('woff2'); unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB; }
      @font-face { font-family: 'Montserrat VN'; font-style: normal; font-weight: 400 900; src: url('assets/fonts/montserrat-vn-normal-latin-ext.woff2') format('woff2'); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF; }
      @font-face { font-family: 'Montserrat VN'; font-style: normal; font-weight: 400 900; src: url('assets/fonts/montserrat-vn-normal-latin.woff2') format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
      /* Space/Orbit: troi sao, hanh tinh co vanh, ve tinh bay quanh tren quy dao det. Rong lon, cham, hop tam nhin va khoi dau moi. */
      :root { --nen: #8a8f96; --dem: #0a0f2c; --cam: #ff9d4d; --cam-dam: #d9602a; --vanh: #ffd9a8; --xanh: #6fd3ff; --trang: #ffffff;
        --font: 'Montserrat VN', sans-serif; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--nen); }
      #root { position: relative; width: 100%; height: 100%; font-family: var(--font); }
      #sp-the { position: absolute; left: 140px; top: 170px; width: 800px; height: 1000px; overflow: hidden; background: var(--dem); border-radius: 30px; }
      .sp-sao { position: absolute; width: 6px; height: 6px; border-radius: 50%; background: var(--trang); }
      #sp-s1 { left: 70px; top: 60px; } #sp-s2 { left: 680px; top: 120px; } #sp-s3 { left: 130px; top: 720px; } #sp-s4 { left: 720px; top: 760px; }
      #sp-s5 { left: 380px; top: 40px; } #sp-s6 { left: 60px; top: 420px; } #sp-s7 { left: 740px; top: 460px; } #sp-s8 { left: 300px; top: 900px; }
      #sp-he { position: absolute; left: 400px; top: 400px; width: 0; height: 0; }
      #sp-hanh-tinh { position: absolute; left: -150px; top: -150px; width: 300px; height: 300px; border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, var(--cam) 0%, var(--cam-dam) 78%); }
      #sp-vanh { position: absolute; left: -270px; top: -62px; width: 540px; height: 124px; border-radius: 50%;
        border: 14px solid var(--vanh); opacity: 0.9; }
      #sp-che { position: absolute; left: -150px; top: -150px; width: 300px; height: 150px; overflow: hidden; }
      #sp-che-trong { position: absolute; left: 0; top: 0; width: 300px; height: 300px; border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, var(--cam) 0%, var(--cam-dam) 78%); }
      #sp-quy-dao { position: absolute; left: -340px; top: -120px; width: 680px; height: 240px; }
      #sp-ve-tinh { position: absolute; left: -22px; top: -22px; width: 44px; height: 44px; border-radius: 50%; background: var(--xanh); }
      #sp-tieu-de { position: absolute; left: 0; right: 0; top: 700px; text-align: center; font-size: 88px; font-weight: 900;
        letter-spacing: -0.02em; color: var(--trang); }
      #sp-phu { position: absolute; left: 0; right: 0; top: 815px; text-align: center; font-size: 40px; font-weight: 500; color: var(--vanh); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1080" data-height="1920">
      <div id="sp-the" class="clip" data-start="0" data-duration="3" data-track-index="1">
        <div id="sp-s1" class="sp-sao"></div><div id="sp-s2" class="sp-sao"></div><div id="sp-s3" class="sp-sao"></div><div id="sp-s4" class="sp-sao"></div>
        <div id="sp-s5" class="sp-sao"></div><div id="sp-s6" class="sp-sao"></div><div id="sp-s7" class="sp-sao"></div><div id="sp-s8" class="sp-sao"></div>
        <div id="sp-he" data-layout-allow-overflow>
          <div id="sp-hanh-tinh"></div>
          <div id="sp-vanh"></div>
          <div id="sp-che"><div id="sp-che-trong"></div></div>
          <div id="sp-quy-dao" data-layout-allow-overflow><div id="sp-ve-tinh"></div></div>
        </div>
        <div id="sp-tieu-de" data-var-text="tieu-de">Hành trình mới</div>
        <div id="sp-phu" data-var-text="phu">Khởi hành tháng 12</div>
      </div>
    </div>
    <script>
      // Chu ky chuyen dong: cham va rong (power2.out, sine); he hanh tinh phong to tu xa, ve tinh chay tren quy dao det tinh bang cos/sin.
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#sp-the", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "none" }, 0)
        .fromTo("#sp-he", { scale: 0.45, y: 60 }, { scale: 1, y: 0, duration: 1.1, ease: "power2.out" }, 0)
        .fromTo(".sp-sao", { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.4, stagger: 0.05, ease: "power2.out" }, 0.1);
      // Ve tinh: goc chay tu 200 do toi 560 do, vi tri tinh truoc (quyet dinh, render lai giong het).
      const ve = { g: 200 };
      const dat = () => {
        const r = (ve.g * Math.PI) / 180;
        gsap.set("#sp-ve-tinh", { x: 340 + 340 * Math.cos(r), y: 120 + 120 * Math.sin(r) });
      };
      tl.fromTo(ve, { g: 200 }, { g: 560, duration: 3, ease: "none", onUpdate: dat }, 0);
      dat();
      tl.fromTo("#sp-tieu-de", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power2.out" }, 0.55)
        .fromTo("#sp-phu", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "none" }, 0.85)
        .to("#sp-the", { opacity: 0, duration: 0.3, ease: "none" }, 2.66);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
