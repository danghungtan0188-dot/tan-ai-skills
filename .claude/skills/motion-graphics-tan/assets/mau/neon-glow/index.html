<!doctype html>
<html lang="vi" data-resolution="portrait"
  data-composition-variables='[{"id":"dong1","type":"string","label":"Dòng 1","default":"MỞ CỬA"},{"id":"dong2","type":"string","label":"Dòng 2","default":"đến 22 giờ"},{"id":"phu","type":"string","label":"Dòng phụ","default":"Mỗi tối cuối tuần"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: 'Tilt Neon VN'; font-style: normal; font-weight: 400; src: url('assets/fonts/tilt-neon-vn-normal-vietnamese.woff2') format('woff2'); unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB; }
      @font-face { font-family: 'Tilt Neon VN'; font-style: normal; font-weight: 400; src: url('assets/fonts/tilt-neon-vn-normal-latin-ext.woff2') format('woff2'); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF; }
      @font-face { font-family: 'Tilt Neon VN'; font-style: normal; font-weight: 400; src: url('assets/fonts/tilt-neon-vn-normal-latin.woff2') format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
      /* Neon glow: bang den ong tren tuong toi -- chu mau dac + vang sang nhieu lop text-shadow, khi bat den thi chop vai lan. */
      :root { --nen: #8a8f96; --tuong: #0d0a1a; --hong: #ff3fa4; --luc: #22e6ff; --vang: #ffe66d; --trang: #fff5fb;
        --font: 'Tilt Neon VN', sans-serif; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--nen); }
      #root { position: relative; width: 100%; height: 100%; font-family: var(--font); }
      #ne-the { position: absolute; left: 140px; top: 170px; width: 800px; height: 1000px; overflow: hidden; background: var(--tuong); border-radius: 14px; }
      #ne-khung { position: absolute; left: 60px; top: 150px; width: 680px; height: 640px; border: 8px solid var(--trang); border-radius: 44px;
        box-shadow: 0 0 18px var(--luc), 0 0 46px var(--luc), inset 0 0 18px var(--luc), inset 0 0 46px var(--luc); }
      #ne-d1 { position: absolute; left: 0; right: 0; top: 270px; text-align: center; font-size: 128px; line-height: 1; color: var(--trang);
        text-shadow: 0 0 14px var(--hong), 0 0 36px var(--hong), 0 0 72px var(--hong); }
      #ne-d2 { position: absolute; left: 0; right: 0; top: 430px; text-align: center; font-size: 92px; line-height: 1; color: var(--trang);
        text-shadow: 0 0 12px var(--luc), 0 0 32px var(--luc), 0 0 64px var(--luc); }
      #ne-phu { position: absolute; left: 0; right: 0; top: 620px; text-align: center; font-size: 46px; line-height: 1; color: var(--vang);
        text-shadow: 0 0 12px var(--vang), 0 0 28px var(--vang); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1080" data-height="1920">
      <div id="ne-the" class="clip" data-start="0" data-duration="3" data-track-index="1">
        <div id="ne-khung"></div>
        <div id="ne-d1" data-var-text="dong1">MỞ CỬA</div>
        <div id="ne-d2" data-var-text="dong2">đến 22 giờ</div>
        <div id="ne-phu" data-var-text="phu">Mỗi tối cuối tuần</div>
      </div>
    </div>
    <script>
      // Chu ky chuyen dong: bat den ong -- tung phan chop vai lan (tl.set opacity, moc co dinh) roi sang han; sau do tho nhe.
      const tl = gsap.timeline({ paused: true });
      const chop = (chon, luc) => {
        [[0, 0], [0.04, 1], [0.1, 0.15], [0.16, 1], [0.24, 0.3], [0.3, 1]].forEach(([t, o]) => tl.set(chon, { opacity: o }, luc + t));
      };
      tl.fromTo("#ne-the", { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "none" }, 0);
      gsap.set("#ne-khung, #ne-d1, #ne-d2, #ne-phu", { opacity: 0 });
      chop("#ne-khung", 0.15); chop("#ne-d1", 0.5); chop("#ne-d2", 0.8); chop("#ne-phu", 1.1);
      tl.to("#ne-d1", { opacity: 0.86, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 1 }, 1.6)
        .to("#ne-the", { opacity: 0, duration: 0.14, ease: "none" }, 2.84);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
