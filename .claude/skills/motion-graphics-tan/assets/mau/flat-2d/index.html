<!doctype html>
<html lang="vi" data-resolution="portrait"
  data-composition-variables='[{"id":"mo-dau","type":"string","label":"Chữ mở đầu","default":"Ra mắt"},{"id":"tieu-de","type":"string","label":"Tiêu đề","default":"Dịch vụ mới"},{"id":"phu","type":"string","label":"Dòng phụ","default":"Bắt đầu từ hôm nay"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>

      @font-face { font-family: 'Montserrat VN'; font-style: italic; font-weight: 400 900; src: url('assets/fonts/montserrat-vn-italic-latin-ext.woff2') format('woff2'); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF; }
      @font-face { font-family: 'Montserrat VN'; font-style: italic; font-weight: 400 900; src: url('assets/fonts/montserrat-vn-italic-latin.woff2') format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
      @font-face { font-family: 'Montserrat VN'; font-style: normal; font-weight: 400 900; src: url('assets/fonts/montserrat-vn-normal-vietnamese.woff2') format('woff2'); unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB; }
      @font-face { font-family: 'Montserrat VN'; font-style: normal; font-weight: 400 900; src: url('assets/fonts/montserrat-vn-normal-latin-ext.woff2') format('woff2'); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF; }
      @font-face { font-family: 'Montserrat VN'; font-style: normal; font-weight: 400 900; src: url('assets/fonts/montserrat-vn-normal-latin.woff2') format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
      /* Flat 2D: hinh phang, mau dac, khong bong khong gradient. Than thien, de hieu, hop gioi thieu app va dich vu. */
      :root { --nen: #8a8f96; --troi: #1b2a5b; --cam: #ff7a30; --cam-dam: #e25c12; --vang: #ffc83d; --trang: #ffffff;
        --font: 'Montserrat VN', sans-serif; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--nen); }
      #root { position: relative; width: 100%; height: 100%; font-family: var(--font); }
      #fl-the { position: absolute; left: 140px; top: 170px; width: 800px; height: 1000px; overflow: hidden;
        background: var(--troi); border-radius: 44px; }
      .fl-sao { position: absolute; width: 14px; height: 14px; border-radius: 50%; background: var(--trang); }
      #fl-s1 { left: 90px; top: 110px; } #fl-s2 { left: 660px; top: 90px; } #fl-s3 { left: 700px; top: 400px; }
      #fl-s4 { left: 70px; top: 470px; } #fl-s5 { left: 400px; top: 60px; }
      #fl-mo-dau { position: absolute; left: 80px; top: 170px; font-size: 62px; font-weight: 700; color: var(--trang); }
      #fl-tieu-de { position: absolute; left: 80px; top: 250px; font-size: 100px; font-weight: 900; line-height: 1.08;
        letter-spacing: -0.02em; color: var(--cam); }
      #fl-phu { position: absolute; left: 80px; top: 380px; padding: 12px 26px; border-radius: 40px; background: var(--vang);
        color: var(--troi); font-size: 32px; font-weight: 700; }
      #fl-hanh-tinh { position: absolute; left: 150px; top: 610px; width: 500px; height: 500px; border-radius: 50%;
        background: var(--cam); }
      .fl-ho { position: absolute; border-radius: 50%; background: var(--cam-dam); }
      #fl-h1 { left: 90px; top: 110px; width: 110px; height: 110px; }
      #fl-h2 { left: 300px; top: 70px; width: 64px; height: 64px; }
      #fl-h3 { left: 250px; top: 220px; width: 84px; height: 84px; }
      #fl-quy-dao { position: absolute; left: 400px; top: 860px; width: 0; height: 0; }
      #fl-ve-tinh { position: absolute; left: -24px; top: -320px; width: 48px; height: 48px; border-radius: 50%;
        background: var(--vang); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1080" data-height="1920">
      <div id="fl-the" class="clip" data-start="0" data-duration="3" data-track-index="1">
        <div id="fl-s1" class="fl-sao"></div><div id="fl-s2" class="fl-sao"></div><div id="fl-s3" class="fl-sao"></div>
        <div id="fl-s4" class="fl-sao"></div><div id="fl-s5" class="fl-sao"></div>
        <div id="fl-hanh-tinh" data-layout-allow-overflow>
          <div id="fl-h1" class="fl-ho"></div><div id="fl-h2" class="fl-ho"></div><div id="fl-h3" class="fl-ho"></div>
        </div>
        <div id="fl-quy-dao" data-layout-allow-overflow><div id="fl-ve-tinh"></div></div>
        <div id="fl-mo-dau" data-var-text="mo-dau">Ra mắt</div>
        <div id="fl-tieu-de" data-var-text="tieu-de">Dịch vụ mới</div>
        <div id="fl-phu" data-var-text="phu">Bắt đầu từ hôm nay</div>
      </div>
    </div>
    <script>
      // Chu ky chuyen dong: tron va than thien (power2.out, nay nhe back.out); hanh tinh troi len, ve tinh quay, sao nhap nhay.
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#fl-the", { scale: 0.92, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "power2.out" }, 0)
        .fromTo("#fl-hanh-tinh", { y: 460 }, { y: 0, duration: 0.8, ease: "power2.out" }, 0.1)
        .fromTo("#fl-hanh-tinh", { rotation: -14 }, { rotation: 10, duration: 2.9, ease: "none" }, 0.1)
        .fromTo("#fl-quy-dao", { rotation: -70 }, { rotation: 70, duration: 3, ease: "none" }, 0)
        .fromTo(".fl-sao", { scale: 0 }, { scale: 1, duration: 0.4, stagger: 0.08, ease: "back.out(3)" }, 0.2)
        .fromTo("#fl-mo-dau", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power2.out" }, 0.35)
        .fromTo("#fl-tieu-de", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "back.out(1.6)" }, 0.5)
        .fromTo("#fl-phu", { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(2)" }, 0.75)
        .to("#fl-the", { scale: 0.94, opacity: 0, duration: 0.28, ease: "power2.in" }, 2.68);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
