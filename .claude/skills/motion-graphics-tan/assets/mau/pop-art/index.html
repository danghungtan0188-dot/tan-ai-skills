<!doctype html>
<html lang="vi" data-resolution="portrait"
  data-composition-variables='[{"id":"keu","type":"string","label":"Tiếng kêu","default":"ƯU ĐÃI!"},{"id":"so","type":"string","label":"Con số","default":"-50%"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      /* Pop Art: truyen tranh my -- tia nang, cham halftone, ngoi sao no, vien den day, chu nghieng. Nay manh, on ao. */
      :root { --nen: #8a8f96; --vang: #ffd60a; --cam: #ffb800; --do: #e5202a; --xanh: #1457d9; --den: #111111;
        --font: "Montserrat", sans-serif; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--nen); }
      #root { position: relative; width: 100%; height: 100%; font-family: var(--font); }
      #pa-the { position: absolute; left: 140px; top: 170px; width: 800px; height: 1000px; overflow: hidden;
        background: var(--vang); border: 10px solid var(--den); border-radius: 6px; }
      #pa-tia { position: absolute; left: -300px; top: -200px; width: 1400px; height: 1400px;
        background: repeating-conic-gradient(var(--cam) 0deg 12deg, var(--vang) 12deg 24deg); }
      #pa-cham { position: absolute; inset: 0; background-image: radial-gradient(var(--do) 28%, transparent 30%);
        background-size: 26px 26px; opacity: 0.22; }
      #pa-no { position: absolute; left: 90px; top: 150px; width: 600px; height: 600px; background: var(--do);
        clip-path: polygon(50% 0%, 61% 18%, 79% 7%, 80% 28%, 100% 30%, 88% 47%, 100% 65%, 80% 68%, 79% 91%, 61% 80%,
          50% 100%, 39% 80%, 21% 91%, 20% 68%, 0% 65%, 12% 47%, 0% 30%, 20% 28%, 21% 7%, 39% 18%); }
      #pa-keu { position: absolute; left: 0; right: 0; top: 375px; text-align: center; font-size: 118px; font-weight: 900;
        font-style: italic; letter-spacing: -0.03em; color: #fff; -webkit-text-stroke: 5px var(--den);
        paint-order: stroke fill; }
      #pa-so { position: absolute; left: 0; right: 0; top: 730px; text-align: center; font-size: 170px; font-weight: 900;
        font-style: italic; letter-spacing: -0.04em; color: var(--xanh); -webkit-text-stroke: 6px #fff;
        paint-order: stroke fill; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1080" data-height="1920">
      <div id="pa-the" class="clip" data-start="0" data-duration="3" data-track-index="1">
        <div id="pa-tia" data-layout-allow-overflow></div>
        <div id="pa-cham"></div>
        <div id="pa-no"></div>
        <div id="pa-keu" data-var-text="keu">ƯU ĐÃI!</div>
        <div id="pa-so" data-var-text="so">-50%</div>
      </div>
    </div>
    <script>
      // Chu ky chuyen dong: bat vao qua da (back.out), tia nang xoay cham, ngoi sao lac nhe nhu dap theo nhip.
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#pa-the", { scale: 0.6, rotation: -6, opacity: 0 }, { scale: 1, rotation: 0, opacity: 1, duration: 0.35, ease: "back.out(2.2)" }, 0)
        .fromTo("#pa-tia", { rotation: 0 }, { rotation: 48, duration: 3, ease: "none" }, 0)
        .fromTo("#pa-no", { scale: 0, rotation: -40 }, { scale: 1, rotation: 0, duration: 0.45, ease: "back.out(3)" }, 0.2)
        .fromTo("#pa-keu", { scale: 0, rotation: 14 }, { scale: 1, rotation: -6, duration: 0.4, ease: "back.out(3.5)" }, 0.4)
        .fromTo("#pa-so", { y: 220, rotation: 10 }, { y: 0, rotation: -3, duration: 0.4, ease: "back.out(2.5)" }, 0.65)
        .to("#pa-no", { scale: 1.07, duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: 5 }, 1.1)
        .to("#pa-the", { scale: 0.7, rotation: 5, opacity: 0, duration: 0.22, ease: "back.in(2)" }, 2.72);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
