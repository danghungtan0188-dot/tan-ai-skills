<!doctype html>
<html lang="vi" data-resolution="portrait"
  data-composition-variables='[{"id":"tieu-de","type":"string","label":"Tiêu đề","default":"Gọn. Rõ. Đẹp."},{"id":"phu","type":"string","label":"Dòng phụ","default":"Thiết kế cho video ngắn"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: 'Inter VN'; font-style: normal; font-weight: 400 900; src: url('assets/fonts/inter-vn-normal-vietnamese.woff2') format('woff2'); unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB; }
      @font-face { font-family: 'Inter VN'; font-style: normal; font-weight: 400 900; src: url('assets/fonts/inter-vn-normal-latin-ext.woff2') format('woff2'); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF; }
      @font-face { font-family: 'Inter VN'; font-style: normal; font-weight: 400 900; src: url('assets/fonts/inter-vn-normal-latin.woff2') format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
      /* Bauhaus: ba hinh co ban (tron, vuong, tam giac), ba mau co ban, chu sans don gian. Hinh khoi la bo cuc. */
      :root { --nen: #8a8f96; --kem: #efe6d5; --do: #d7382e; --lam: #1f4fa3; --vang: #efb810; --den: #161616;
        --font: 'Inter VN', sans-serif; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--nen); }
      #root { position: relative; width: 100%; height: 100%; font-family: var(--font); }
      #ba-the { position: absolute; left: 140px; top: 170px; width: 800px; height: 1000px; overflow: hidden;
        background: var(--kem); border-radius: 6px; }
      #ba-tron { position: absolute; left: 60px; top: 60px; width: 340px; height: 340px; border-radius: 50%; background: var(--do); }
      #ba-vuong { position: absolute; left: 420px; top: 60px; width: 320px; height: 320px; background: var(--lam); }
      #ba-tam-giac { position: absolute; left: 60px; top: 420px; width: 400px; height: 300px; background: var(--vang);
        clip-path: polygon(50% 0%, 100% 100%, 0% 100%); }
      #ba-nua { position: absolute; left: 480px; top: 400px; width: 260px; height: 320px; background: var(--den);
        border-radius: 0 160px 160px 0; }
      #ba-tieu-de { position: absolute; left: 60px; top: 770px; font-size: 92px; font-weight: 900; letter-spacing: -0.04em;
        line-height: 1; color: var(--den); }
      #ba-phu { position: absolute; left: 62px; top: 884px; font-size: 34px; font-weight: 400; color: var(--den); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1080" data-height="1920">
      <div id="ba-the" class="clip" data-start="0" data-duration="3" data-track-index="1">
        <div id="ba-tron"></div>
        <div id="ba-vuong"></div>
        <div id="ba-tam-giac"></div>
        <div id="ba-nua"></div>
        <div id="ba-tieu-de" data-var-text="tieu-de">Gọn. Rõ. Đẹp.</div>
        <div id="ba-phu" data-var-text="phu">Thiết kế cho video ngắn</div>
      </div>
    </div>
    <script>
      // Chu ky chuyen dong: hinh khoi vao lan luot nhu xep do choi (power4.inOut, xoay dung 90 do), roi dung han; chu vao sau cung.
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#ba-the", { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "none" }, 0)
        .fromTo("#ba-tron", { x: -460 }, { x: 0, duration: 0.6, ease: "power4.inOut" }, 0.05)
        .fromTo("#ba-vuong", { y: -420, rotation: 90 }, { y: 0, rotation: 0, duration: 0.6, ease: "power4.inOut" }, 0.2)
        .fromTo("#ba-tam-giac", { y: 700 }, { y: 0, duration: 0.6, ease: "power4.inOut" }, 0.35)
        .fromTo("#ba-nua", { x: 340 }, { x: 0, duration: 0.6, ease: "power4.inOut" }, 0.5)
        .fromTo("#ba-tieu-de", { x: -40, opacity: 0 }, { x: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 0.95)
        .fromTo("#ba-phu", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "none" }, 1.15)
        .to("#ba-tron", { scale: 0.9, duration: 0.5, ease: "power4.inOut" }, 1.6)
        .to("#ba-tron", { scale: 1, duration: 0.5, ease: "power4.inOut" }, 2.1)
        .to("#ba-the", { opacity: 0, duration: 0.2, ease: "none" }, 2.75);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
