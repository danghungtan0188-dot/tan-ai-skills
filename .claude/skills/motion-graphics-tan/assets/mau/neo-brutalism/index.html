    <script>
      // Chu ky chuyen dong: dap manh, dung gat (power4.out, cuc ngan), nhan dan xoay lech; nut bi "an" that: bong mat, nut lun xuong.
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#nb-the", { y: 120, opacity: 0 }, { y: 0, opacity: 1, duration: 0.18, ease: "power4.out" }, 0)
        .fromTo("#nb-hop", { x: -760 }, { x: 0, duration: 0.25, ease: "power4.out" }, 0.15)
        .fromTo("#nb-dan", { scale: 3, rotation: 30, opacity: 0 }, { scale: 1, rotation: 8, opacity: 1, duration: 0.2, ease: "power4.out" }, 0.45)
        .fromTo("#nb-nut", { y: 300 }, { y: 0, duration: 0.25, ease: "power4.out" }, 0.65)
        .to("#nb-nut", { x: 14, y: 14, boxShadow: "0px 0px 0 #000000", duration: 0.08, ease: "none" }, 1.5)
        .to("#nb-nut", { x: 0, y: 0, boxShadow: "14px 14px 0 #000000", duration: 0.12, ease: "power4.out" }, 1.68)
        .to("#nb-the", { y: -120, opacity: 0, duration: 0.16, ease: "power4.in" }, 2.8);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
