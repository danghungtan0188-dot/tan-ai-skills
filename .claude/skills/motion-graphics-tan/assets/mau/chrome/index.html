    <div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1080" data-height="1920">
      <div id="cr-the" class="clip" data-start="0" data-duration="3" data-track-index="1">
        <div id="cr-dia"></div>
        <div id="cr-tam"></div>
        <div id="cr-tam-kl">
          <div id="cr-quet"></div>
          <div id="cr-tieu-de" data-var-text="tieu-de">BẢN CAO CẤP</div>

    <script>
      // Chu ky chuyen dong: nang va chinh xac (power3.out); dia quay cham tao anh kim loai chay, vet sang quet qua tam kim loai mot lan.
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#cr-the", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "none" }, 0)
        .fromTo("#cr-dia", { rotation: -60 }, { rotation: 120, duration: 3, ease: "none" }, 0)
        .fromTo("#cr-dia, #cr-tam", { scale: 0.75 }, { scale: 1, duration: 0.8, ease: "power3.out" }, 0)
        .fromTo("#cr-tam-kl", { y: 160, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 0.4)
        .fromTo("#cr-quet", { x: 0, rotation: 18 }, { x: 1100, rotation: 18, duration: 0.8, ease: "power2.inOut" }, 1.1)
        .to("#cr-the", { opacity: 0, duration: 0.28, ease: "none" }, 2.68);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
