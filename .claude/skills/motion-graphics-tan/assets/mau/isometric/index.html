      :root { --nen: #8a8f96; --nen-the: #f1f3fb; --lam: #3454d1; --hong: #e83f6f; --vang: #ffbf00; --muc: #171a2b;

    <div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1080" data-height="1920">

    <script>
      // Chu ky chuyen dong: xep chong roi bung len theo truc z (power3.inOut); ke va nhan hien lan luot tu lop tren xuong, goc nhin co dinh.
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#is-the", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "none" }, 0)
        .fromTo("#is-tieu-de", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 0.1)
        .fromTo("#is-t3", { z: 0 }, { z: -150, duration: 0.8, ease: "power3.inOut" }, 0.45)
        .fromTo("#is-t2", { z: 0 }, { z: 70, duration: 0.8, ease: "power3.inOut" }, 0.45)
        .fromTo("#is-t1", { z: 0 }, { z: 290, duration: 0.8, ease: "power3.inOut" }, 0.45)
        .fromTo(".is-ke", { scaleX: 0 }, { scaleX: 1, duration: 0.3, stagger: 0.14, ease: "power2.out" }, 1.0)
        .fromTo(".is-nhan", { x: -20, opacity: 0 }, { x: 0, opacity: 1, duration: 0.3, stagger: 0.14, ease: "power2.out" }, 1.08)
        .to("#is-the", { opacity: 0, duration: 0.26, ease: "none" }, 2.7);
      window.__timelines["main"] = tl;
      tl.seek(0);
