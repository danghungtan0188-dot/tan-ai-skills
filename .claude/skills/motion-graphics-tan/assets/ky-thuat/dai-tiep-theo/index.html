<!doctype html>
<html lang="vi" data-resolution="landscape"
  data-composition-variables='[{"id": "nhan", "type": "string", "label": "Nhãn", "default": "TIẾP THEO"}, {"id": "noi-dung", "type": "string", "label": "Nội dung", "default": "Bí quyết trồng dưa lưới trong nhà màng"}, {"id": "hen", "type": "string", "label": "Lời hẹn", "default": "Hẹn gặp lại lúc 19 giờ 10 thứ bảy tuần sau"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: 'Montserrat VN'; font-style: normal; font-weight: 400 900; src: url('assets/fonts/montserrat-vn-normal-vietnamese.woff2') format('woff2'); unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB; }
      @font-face { font-family: 'Montserrat VN'; font-style: normal; font-weight: 400 900; src: url('assets/fonts/montserrat-vn-normal-latin-ext.woff2') format('woff2'); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF; }
      @font-face { font-family: 'Montserrat VN'; font-style: normal; font-weight: 400 900; src: url('assets/fonts/montserrat-vn-normal-latin.woff2') format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
      /* Tiep theo: nhan do bat vao, noi dung truot len, loi hen go dan; dung truoc gio nghi hoac cuoi chuong trinh. */
      :root { --nen: #8a8f96; --navy: #00164E; --navy2: #0A3C92; --vang: #FFCD2D; --trang: #ffffff; --den: #0b0f1a; --do: #CE2027; --xanh: #007A3D; --lam: #1A3CAA; --font: 'Montserrat VN', sans-serif; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--nen); }
      #root { position: relative; width: 100%; height: 100%; font-family: var(--font); }
      #tt2 { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; background: radial-gradient(ellipse at 50% 50%, var(--navy2) 0%, var(--navy) 70%); }
      #tt2-nhan-hop { position: absolute; left: 160px; top: 330px; height: 90px; padding: 0 40px; display: flex; align-items: center; background: var(--do); border-radius: 10px; }
      #tt2-nhan { font-size: 50px; font-weight: 900; color: var(--trang); }
      #tt2-nd { position: absolute; left: 160px; top: 450px; width: 1600px; font-size: 76px; line-height: 1.15; font-weight: 900; color: var(--trang); }
      #tt2-hen-khung { position: absolute; left: 160px; top: 700px; }
      #tt2-hen { font-size: 42px; font-weight: 700; color: var(--vang); white-space: nowrap; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1920" data-height="1080">
      <div id="tt2" class="clip" data-start="0" data-track-index="1" data-duration="5">
        <div id="tt2-nhan-hop"><div id="tt2-nhan" data-var-text="nhan">TIẾP THEO</div></div>
        <div id="tt2-nd" data-var-text="noi-dung">Bí quyết trồng dưa lưới trong nhà màng</div>
        <div id="tt2-hen-khung"><div id="tt2-hen" data-var-text="hen">Hẹn gặp lại lúc 19 giờ 10 thứ bảy tuần sau</div></div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#tt2", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0)
        .fromTo("#tt2-nhan-hop", { scale: 0, transformOrigin: "left center" }, { scale: 1, duration: 0.35, ease: "back.out(2)" }, 0.15)
        .fromTo("#tt2-nd", { y: 50, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 0.4)
        .fromTo("#tt2-hen", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 1.2, ease: "steps(30)" }, 1.0)
        .to("#tt2", { opacity: 0, duration: 0.35 }, 4.65);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
