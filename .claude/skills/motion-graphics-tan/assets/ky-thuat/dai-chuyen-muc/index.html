<!doctype html>
<html lang="vi" data-resolution="landscape"
  data-composition-variables='[{"id": "ten-muc", "type": "string", "label": "Tên mục", "default": "NÔNG NGHIỆP"}, {"id": "phu", "type": "string", "label": "Dòng phụ", "default": "Chuyên mục hằng tuần"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: 'Montserrat VN'; font-style: normal; font-weight: 400 900; src: url('assets/fonts/montserrat-vn-normal-vietnamese.woff2') format('woff2'); unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB; }
      @font-face { font-family: 'Montserrat VN'; font-style: normal; font-weight: 400 900; src: url('assets/fonts/montserrat-vn-normal-latin-ext.woff2') format('woff2'); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF; }
      @font-face { font-family: 'Montserrat VN'; font-style: normal; font-weight: 400 900; src: url('assets/fonts/montserrat-vn-normal-latin.woff2') format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
      /* Bumper chuyen muc 3 s giua cac phan: moi muc doi mau --mau-muc. */
      :root { --nen: #8a8f96; --navy: #00164E; --navy2: #0A3C92; --vang: #FFCD2D; --trang: #ffffff; --den: #0b0f1a; --do: #CE2027; --xanh: #007A3D; --lam: #1A3CAA; --font: 'Montserrat VN', sans-serif; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--nen); }
      #root { position: relative; width: 100%; height: 100%; font-family: var(--font); }
      #cm { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--navy); }
      #cm-quet { position: absolute; left: -400px; top: -200px; width: 2800px; height: 1500px; background: var(--xanh); transform: skewX(-18deg); }
      #cm-ten { position: absolute; left: 0; right: 0; top: 400px; text-align: center; font-size: 150px; font-weight: 900; color: var(--trang); }
      #cm-gach { position: absolute; left: 760px; top: 600px; width: 400px; height: 10px; border-radius: 5px; background: var(--vang); }
      #cm-phu { position: absolute; left: 0; right: 0; top: 640px; text-align: center; font-size: 44px; font-weight: 700; color: var(--trang); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1920" data-height="1080">
      <div id="cm" class="clip" data-start="0" data-track-index="1" data-duration="3" data-layout-allow-overflow>
        <div id="cm-quet"></div>
        <div id="cm-ten" data-var-text="ten-muc">NÔNG NGHIỆP</div>
        <div id="cm-gach"></div>
        <div id="cm-phu" data-var-text="phu">Chuyên mục hằng tuần</div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#cm-quet", { x: -2900 }, { x: 0, duration: 0.45, ease: "power3.out" }, 0)
        .fromTo("#cm-ten", { scale: 1.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "power4.out" }, 0.35)
        .fromTo("#cm-gach", { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power3.out" }, 0.6)
        .fromTo("#cm-phu", { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power2.out" }, 0.7)
        .to("#cm-quet", { x: 2900, duration: 0.4, ease: "power3.in" }, 2.55)
        .to(["#cm-ten", "#cm-gach", "#cm-phu"], { opacity: 0, duration: 0.25 }, 2.6);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
