<!doctype html>
<html lang="vi" data-resolution="landscape"
  data-composition-variables='[{"id": "nhan", "type": "string", "label": "Nhãn", "default": "TIN NÓNG"}, {"id": "tit", "type": "string", "label": "Tít tin", "default": "Mưa lớn kéo dài, nhiều diện tích lúa có nguy cơ ngập úng"}, {"id": "bang", "type": "string", "label": "Băng dưới", "default": "Bà con theo dõi bản tin thời tiết để chủ động thu hoạch"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: 'Montserrat VN'; font-style: normal; font-weight: 400 900; src: url('assets/fonts/montserrat-vn-normal-vietnamese.woff2') format('woff2'); unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB; }
      @font-face { font-family: 'Montserrat VN'; font-style: normal; font-weight: 400 900; src: url('assets/fonts/montserrat-vn-normal-latin-ext.woff2') format('woff2'); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF; }
      @font-face { font-family: 'Montserrat VN'; font-style: normal; font-weight: 400 900; src: url('assets/fonts/montserrat-vn-normal-latin.woff2') format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
      /* Tin nong toan khung: nen do, nhan nhap nhay 2 lan, tit lon, bang vang ben duoi. */
      :root { --nen: #8a8f96; --navy: #00164E; --navy2: #0A3C92; --vang: #FFCD2D; --trang: #ffffff; --den: #0b0f1a; --do: #CE2027; --xanh: #007A3D; --lam: #1A3CAA; --font: 'Montserrat VN', sans-serif; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--nen); }
      #root { position: relative; width: 100%; height: 100%; font-family: var(--font); }
      #tn { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; background: linear-gradient(135deg, #8E0F14 0%, var(--do) 60%, #E2383E 100%); }
      #tn-nhan-hop { position: absolute; left: 160px; top: 230px; height: 110px; padding: 0 50px; display: flex; align-items: center; background: var(--trang); border-radius: 12px; }
      #tn-nhan { font-size: 72px; font-weight: 900; color: var(--do); }
      #tn-tit { position: absolute; left: 160px; top: 390px; width: 1600px; font-size: 80px; line-height: 1.15; font-weight: 900; color: var(--trang); }
      #tn-bang { position: absolute; left: 0; right: 0; top: 800px; height: 100px; background: var(--vang); display: flex; align-items: center; padding-left: 160px; }
      #tn-bang-chu { font-size: 42px; font-weight: 800; color: var(--navy); white-space: nowrap; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1920" data-height="1080">
      <div id="tn" class="clip" data-start="0" data-track-index="1" data-duration="5">
        <div id="tn-nhan-hop"><div id="tn-nhan" data-var-text="nhan">TIN NÓNG</div></div>
        <div id="tn-tit" data-var-text="tit">Mưa lớn kéo dài, nhiều diện tích lúa có nguy cơ ngập úng</div>
        <div id="tn-bang"><div id="tn-bang-chu" data-var-text="bang">Bà con theo dõi bản tin thời tiết để chủ động thu hoạch</div></div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#tn", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 0)
        .fromTo("#tn-nhan-hop", { scale: 1.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "power4.out" }, 0.1)
        .to("#tn-nhan-hop", { opacity: 0.25, duration: 0.15, yoyo: true, repeat: 3 }, 0.5)
        .fromTo("#tn-tit", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 0.45)
        .fromTo("#tn-bang", { x: -1920 }, { x: 0, duration: 0.45, ease: "power3.out" }, 0.8)
        .to("#tn", { opacity: 0, duration: 0.3 }, 4.7);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
