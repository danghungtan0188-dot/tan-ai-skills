name: xay-ai-agent
description: >
  Thiet ke va xay AI agent chay that: agent tu dong theo lich (doc nguon,
  tong hop, gui bao cao), agent gan trong webapp/phan mem (chat, tro ly,
  tool use), workflow agent tren Claude Managed Agents, Agent SDK, n8n hoac
  cron. Dua tren 6 thanh phan va 6 quy tac cua Anthropic, them dry-run, eval,
  khoa chong trung, nhat ky luot chay, tran chi phi. Code webapp thong thuong
  dung skill phat-trien-app.
entrypoint: SKILL.md
language: vi
references:
  - references/thiet-ke-automation.md
  - references/agent-trong-app.md
  - references/kiem-thu-agent.md
runtime:
  interpreter: none
  network_access: false
  requires_external_packages: false
  external_tools:
    - git
constraints:
  - Khong tu tao tai khoan, khong tu lay hay ghi API key.
  - Khong tu deploy, khong tu bat lich chay that; chay dry-run truoc.
  - Khong cap quyen ghi khong hoan tac duoc cho agent khi chua co buoc nguoi duyet.
  - Khong bao xong khi bo eval chua chay.
  - Model id va API lay tu skill claude-api, khong viet tu tri nho.
