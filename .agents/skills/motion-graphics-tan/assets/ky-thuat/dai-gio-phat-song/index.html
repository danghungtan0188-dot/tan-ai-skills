<!doctype html>
<html lang="vi" data-resolution="landscape"
  data-composition-variables='[{"id": "ten-chuong-trinh", "type": "string", "label": "Tên chương trình", "default": "NÔNG THÔN HÔM NAY"}, {"id": "tap", "type": "string", "label": "Tập", "default": "Tập 1"}, {"id": "gio-phat", "type": "string", "label": "Giờ phát", "default": "19 giờ 10"}, {"id": "ngay", "type": "string", "label": "Ngày", "default": "Thứ bảy, ngày 21/11/2026"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: 'Montserrat VN'; font-style: normal; font-weight: 400 900; src: url('assets/fonts/montserrat-vn-normal-vietnamese.woff2') format('woff2'); unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB; }
      @font-face { font-family: 'Montserrat VN'; font-style: normal; font-weight: 400 900; src: url('assets/fonts/montserrat-vn-normal-latin-ext.woff2') format('woff2'); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF; }
      @font-face { font-family: 'Montserrat VN'; font-style: normal; font-weight: 400 900; src: url('assets/fonts/montserrat-vn-normal-latin.woff2') format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
      /* The gio phat song: vao xong trong 1 s, dung yen 4,5 s cho nguoi xem doc kip (hoc tu trailer THDT: giu 6,6 s). */
      :root { --nen: #8a8f96; --navy: #00164E; --navy2: #0A3C92; --vang: #FFCD2D; --trang: #ffffff; --den: #0b0f1a; --do: #CE2027; --xanh: #007A3D; --lam: #1A3CAA; --font: 'Montserrat VN', sans-serif; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--nen); }
      #root { position: relative; width: 100%; height: 100%; font-family: var(--font); }
      #gp { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden;
        background: radial-gradient(ellipse at 50% 40%, var(--navy2) 0%, var(--navy) 65%, #000818 100%); }
      #gp-tia { position: absolute; left: -400px; top: -300px; width: 2700px; height: 1700px;
        background: repeating-linear-gradient(115deg, rgba(255,255,255,0) 0px, rgba(255,255,255,0) 160px, rgba(255,255,255,0.05) 200px, rgba(255,255,255,0) 240px); }
      #gp-ten { position: absolute; left: 0; right: 0; top: 230px; text-align: center; font-size: 82px; font-weight: 900; color: var(--vang); }
      #gp-tap-hop { position: absolute; left: 810px; top: 380px; width: 300px; height: 86px; border-radius: 43px; background: var(--do);
        display: flex; align-items: center; justify-content: center; }
      #gp-tap { font-size: 46px; font-weight: 900; color: var(--trang); }
      #gp-nho { position: absolute; left: 0; right: 0; top: 520px; text-align: center; font-size: 44px; font-weight: 700; color: var(--trang); }
      #gp-gio { position: absolute; left: 0; right: 0; top: 580px; text-align: center; font-size: 170px; line-height: 1.1; font-weight: 900; color: var(--trang); }
      #gp-gach { position: absolute; left: 660px; top: 790px; width: 600px; height: 8px; border-radius: 4px; background: var(--vang); }
      #gp-ngay { position: absolute; left: 0; right: 0; top: 820px; text-align: center; font-size: 50px; font-weight: 700; color: var(--trang); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <div id="gp" class="clip" data-start="0" data-duration="6" data-track-index="1">
        <div id="gp-tia"></div>
        <div id="gp-ten" data-var-text="ten-chuong-trinh">NÔNG THÔN HÔM NAY</div>
        <div id="gp-tap-hop"><div id="gp-tap" data-var-text="tap">Tập 1</div></div>
        <div id="gp-nho">Phát sóng lúc</div>
        <div id="gp-gio" data-var-text="gio-phat">19 giờ 10</div>
        <div id="gp-gach"></div>
        <div id="gp-ngay" data-var-text="ngay">Thứ bảy, ngày 21/11/2026</div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#gp", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, 0)
        .fromTo("#gp-tia", { x: -200 }, { x: 200, duration: 6, ease: "none" }, 0)
        .fromTo("#gp-ten", { y: -40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 0.15)
        .fromTo("#gp-tap-hop", { scale: 0 }, { scale: 1, duration: 0.35, ease: "back.out(2)" }, 0.35)
        .fromTo("#gp-nho", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.5)
        .fromTo("#gp-gio", { scale: 1.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "power4.out" }, 0.55)
        .fromTo("#gp-gach", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power3.out" }, 0.8)
        .fromTo("#gp-ngay", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "power2.out" }, 0.85)
        .to("#gp", { opacity: 0, duration: 0.35, ease: "power1.in" }, 5.65);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
