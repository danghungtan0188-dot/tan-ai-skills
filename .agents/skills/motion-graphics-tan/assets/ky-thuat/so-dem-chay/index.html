<!doctype html>
<html lang="vi" data-resolution="portrait"
  data-composition-variables='[{"id":"nhan","type":"string","label":"Nhãn trên số","default":"Lượt xem sau 2 tháng"},{"id":"so-cuoi","type":"string","label":"Số cuối (chỉ chữ số)","default":"1400000"},{"id":"don-vi","type":"string","label":"Dòng dưới số","default":"chỉ với điện thoại"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: 'Montserrat VN'; font-style: italic; font-weight: 400 900; src: url('assets/fonts/montserrat-vn-italic-vietnamese.woff2') format('woff2'); unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB; }
      @font-face { font-family: 'Montserrat VN'; font-style: italic; font-weight: 400 900; src: url('assets/fonts/montserrat-vn-italic-latin-ext.woff2') format('woff2'); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF; }
      @font-face { font-family: 'Montserrat VN'; font-style: italic; font-weight: 400 900; src: url('assets/fonts/montserrat-vn-italic-latin.woff2') format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
      @font-face { font-family: 'Montserrat VN'; font-style: normal; font-weight: 400 900; src: url('assets/fonts/montserrat-vn-normal-vietnamese.woff2') format('woff2'); unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB; }
      @font-face { font-family: 'Montserrat VN'; font-style: normal; font-weight: 400 900; src: url('assets/fonts/montserrat-vn-normal-latin-ext.woff2') format('woff2'); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF; }
      @font-face { font-family: 'Montserrat VN'; font-style: normal; font-weight: 400 900; src: url('assets/fonts/montserrat-vn-normal-latin.woff2') format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
      /* So dem chay: so chay tu 0 toi so cuoi, co dau cham hang nghin kieu Viet; cach re nhat de mot con so thanh an tuong.
         Hoc tu Ngo Bang AI (3/5 video co bo dem). */
      :root { --nen: #8a8f96; --the: #1c1712; --trang: #f7f1e8; --cam: #ffb347; --font: 'Montserrat VN', sans-serif; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--nen); }
      #root { position: relative; width: 100%; height: 100%; font-family: var(--font); }
      #sd-the { position: absolute; left: 90px; top: 360px; width: 900px; height: 560px; border-radius: 40px; background: var(--the); }
      #sd-nhan { position: absolute; left: 0; right: 0; top: 80px; text-align: center; font-size: 50px; font-weight: 700; color: var(--trang); }
      #sd-so { position: absolute; left: 0; right: 0; top: 190px; text-align: center; font-size: 150px; line-height: 1; font-weight: 900;
        color: var(--cam); font-variant-numeric: tabular-nums; }
      #sd-dich { display: none; }
      #sd-don-vi { position: absolute; left: 0; right: 0; top: 410px; text-align: center; font-size: 46px; font-weight: 600; color: var(--trang); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="3.5" data-width="1080" data-height="1920">
      <div id="sd-the" class="clip" data-start="0" data-duration="3.5" data-track-index="1">
        <div id="sd-nhan" data-var-text="nhan">Lượt xem sau 2 tháng</div>
        <div id="sd-so">0</div>
        <span id="sd-dich" data-var-text="so-cuoi">1400000</span>
        <div id="sd-don-vi" data-var-text="don-vi">chỉ với điện thoại</div>
      </div>
    </div>
    <script>
      // Dem 0 -> so cuoi trong 1,4 s, cham dan cuoi (power3.out) de mat doc kip con so; xong thi so nay nhe mot lan.
      const tl = gsap.timeline({ paused: true });
      const dich = parseInt(document.querySelector("#sd-dich").textContent.replace(/\D/g, ""), 10) || 0;
      const dem = { v: 0 };
      const hien = () => { document.querySelector("#sd-so").textContent = Math.round(dem.v).toLocaleString("vi-VN"); };
      tl.fromTo("#sd-the", { scale: 0.9, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(1.6)" }, 0)
        .fromTo("#sd-nhan", { y: -20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.25, ease: "power2.out" }, 0.15)
        .fromTo(dem, { v: 0 }, { v: dich, duration: 1.4, ease: "power3.out", onUpdate: hien }, 0.35)
        .to("#sd-so", { scale: 1.08, duration: 0.15, ease: "power1.out", yoyo: true, repeat: 1 }, 1.75)
        .fromTo("#sd-don-vi", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "none" }, 1.8);
      hien();
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
