<!doctype html>
<html lang="vi" data-resolution="landscape"
  data-composition-variables='[{"id": "tieu-de", "type": "string", "label": "Tiêu đề", "default": "ĐỒNG HÀNH CÙNG CHƯƠNG TRÌNH"}, {"id": "tai-tro-1", "type": "string", "label": "Nhà tài trợ 1", "default": "HTX Rau sạch An Thạnh"}, {"id": "tai-tro-2", "type": "string", "label": "Nhà tài trợ 2", "default": "Cơ sở Bánh tráng Bà Năm"}, {"id": "tai-tro-3", "type": "string", "label": "Nhà tài trợ 3", "default": "Vựa trái cây Út Hiền"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: 'Montserrat VN'; font-style: normal; font-weight: 400 900; src: url('assets/fonts/montserrat-vn-normal-vietnamese.woff2') format('woff2'); unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB; }
      @font-face { font-family: 'Montserrat VN'; font-style: normal; font-weight: 400 900; src: url('assets/fonts/montserrat-vn-normal-latin-ext.woff2') format('woff2'); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF; }
      @font-face { font-family: 'Montserrat VN'; font-style: normal; font-weight: 400 900; src: url('assets/fonts/montserrat-vn-normal-latin.woff2') format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
      /* Hang tai tro: moi o vao mot kieu rieng (xoay lat, phong to, truot), dung chung, vet sang luot qua tung o. Thay chu bang logo that khi co. */
      :root { --nen: #8a8f96; --navy: #00164E; --navy2: #0A3C92; --vang: #FFCD2D; --trang: #ffffff; --den: #0b0f1a; --do: #CE2027; --xanh: #007A3D; --lam: #1A3CAA; --font: 'Montserrat VN', sans-serif; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--nen); }
      #root { position: relative; width: 100%; height: 100%; font-family: var(--font); }
      #tt { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; background: #E8F2F4; }
      #tt-tieu { position: absolute; left: 0; right: 0; top: 250px; text-align: center; font-size: 56px; font-weight: 900; color: var(--navy); }
      #tt-gach { position: absolute; left: 860px; top: 340px; width: 200px; height: 8px; border-radius: 4px; background: var(--do); }
      .tt-o { position: absolute; top: 450px; width: 520px; height: 240px; border-radius: 22px; background: var(--trang); overflow: hidden;
        box-shadow: 0 14px 40px rgba(0,22,78,0.18); display: flex; align-items: center; justify-content: center; padding: 0 30px; }
      #tt-1 { left: 120px; } #tt-2 { left: 700px; } #tt-3 { left: 1280px; }
      .tt-chu { font-size: 40px; font-weight: 800; color: var(--navy); text-align: center; line-height: 1.2; }
      .tt-sang { position: absolute; top: -60px; left: -200px; width: 120px; height: 360px;
        background: linear-gradient(90deg, rgba(255,205,45,0) 0%, rgba(255,205,45,0.55) 50%, rgba(255,205,45,0) 100%); transform: rotate(18deg); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <div id="tt" class="clip" data-start="0" data-duration="6" data-track-index="1">
        <div id="tt-tieu" data-var-text="tieu-de">ĐỒNG HÀNH CÙNG CHƯƠNG TRÌNH</div>
        <div id="tt-gach"></div>
        <div class="tt-o" id="tt-1"><div class="tt-chu" data-var-text="tai-tro-1">HTX Rau sạch An Thạnh</div><div class="tt-sang"></div></div>
        <div class="tt-o" id="tt-2"><div class="tt-chu" data-var-text="tai-tro-2">Cơ sở Bánh tráng Bà Năm</div><div class="tt-sang"></div></div>
        <div class="tt-o" id="tt-3"><div class="tt-chu" data-var-text="tai-tro-3">Vựa trái cây Út Hiền</div><div class="tt-sang"></div></div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#tt", { opacity: 0 }, { opacity: 1, duration: 0.25 }, 0)
        .fromTo("#tt-tieu", { y: -30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "power3.out" }, 0.1)
        .fromTo("#tt-gach", { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power3.out" }, 0.3)
        // Moi o mot kieu vao: lat 3D, phong to nay, truot tu phai.
        .fromTo("#tt-1", { rotationY: 90, opacity: 0, transformPerspective: 900 }, { rotationY: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 0.5)
        .fromTo("#tt-2", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: "back.out(1.8)" }, 1.1)
        .fromTo("#tt-3", { x: 400, opacity: 0 }, { x: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 1.7)
        // Vet sang vang luot qua tung o.
        .fromTo(".tt-sang", { x: 0 }, { x: 900, duration: 0.6, ease: "power2.inOut", stagger: 0.25 }, 2.6)
        .to("#tt", { opacity: 0, duration: 0.35, ease: "power1.in" }, 5.65);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
