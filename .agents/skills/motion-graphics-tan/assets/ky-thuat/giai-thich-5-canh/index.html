<!doctype html>
<html lang="vi" data-resolution="portrait"
  data-composition-variables='[{"id":"van-de","type":"string","label":"Cảnh 1: vấn đề của khách","default":"Quay xong mà không biết dựng?"},{"id":"minh-lam","type":"string","label":"Cảnh 2: mình làm gì","default":"Mình dựng video bán hàng cho bạn"},{"id":"buoc-1","type":"string","label":"Cảnh 3: bước 1","default":"1. Gửi clip thô"},{"id":"buoc-2","type":"string","label":"Cảnh 3: bước 2","default":"2. Duyệt kịch bản"},{"id":"buoc-3","type":"string","label":"Cảnh 3: bước 3","default":"3. Nhận video sau 2 ngày"},{"id":"bang-chung","type":"string","label":"Cảnh 4: một bằng chứng","default":"120 video đã giao"},{"id":"ten","type":"string","label":"Cảnh 5: tên","default":"Edit with Tan"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: 'Montserrat VN'; font-style: italic; font-weight: 400 900; src: url('assets/fonts/montserrat-vn-italic-vietnamese.woff2') format('woff2'); unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB; }
      @font-face { font-family: 'Montserrat VN'; font-style: italic; font-weight: 400 900; src: url('assets/fonts/montserrat-vn-italic-latin-ext.woff2') format('woff2'); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF; }
      @font-face { font-family: 'Montserrat VN'; font-style: italic; font-weight: 400 900; src: url('assets/fonts/montserrat-vn-italic-latin.woff2') format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
      @font-face { font-family: 'Montserrat VN'; font-style: normal; font-weight: 400 900; src: url('assets/fonts/montserrat-vn-normal-vietnamese.woff2') format('woff2'); unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB; }
      @font-face { font-family: 'Montserrat VN'; font-style: normal; font-weight: 400 900; src: url('assets/fonts/montserrat-vn-normal-latin-ext.woff2') format('woff2'); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF; }
      @font-face { font-family: 'Montserrat VN'; font-style: normal; font-weight: 400 900; src: url('assets/fonts/montserrat-vn-normal-latin.woff2') format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
      /* Giai thich 5 canh: van de -> minh lam gi -> 3 buoc -> mot bang chung -> ten. Mot khoi nhan mau cam chay qua moi canh
         thay vi mo tu den sang mau nhan; chu cu ra xong chu moi moi vao.
         Hoc cach lam tu prompt explainer doanh nghiep trong awesome-opus5-5-videos (references/hoc-tu-prompt-opus.md). */
      :root { --nen: #8a8f96; --giay: #f4ecdf; --muc: #2b2118; --cam: #ff8a3d; --ngoc: #13867e; --font: 'Montserrat VN', sans-serif; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--nen); }
      #root { position: relative; width: 100%; height: 100%; font-family: var(--font); }
      #gt-nen { position: absolute; inset: 0; background: var(--giay); }
      #gt-nhan { position: absolute; left: 90px; top: 520px; width: 900px; height: 24px; border-radius: 12px; background: var(--cam);
        transform-origin: left center; }
      .gt-nhom { position: absolute; left: 90px; right: 90px; top: 580px; opacity: 0; }
      .gt-muc { font-size: 46px; font-weight: 800; color: var(--ngoc); margin-bottom: 30px; }
      .gt-lon { font-size: 92px; line-height: 1.12; font-weight: 900; color: var(--muc); }
      .gt-buoc { font-size: 64px; line-height: 1.25; font-weight: 800; color: var(--muc); margin-bottom: 26px; opacity: 0; }
      #gt-c4 .gt-lon { color: #b94a10; } /* cam dam: cam sang tren nen kem chi dat 2,3:1 */
      #gt-c5 { text-align: center; left: 60px; right: 60px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="8" data-width="1080" data-height="1920">
      <div id="gt-khoi" class="clip" data-start="0" data-duration="8" data-track-index="1">
        <div id="gt-nen"></div>
        <div id="gt-nhan"></div>
        <div id="gt-c1" class="gt-nhom"><div class="gt-muc">Bạn đang gặp</div><div class="gt-lon" data-var-text="van-de">Quay xong mà không biết dựng?</div></div>
        <div id="gt-c2" class="gt-nhom"><div class="gt-muc">Giải pháp</div><div class="gt-lon" data-var-text="minh-lam">Mình dựng video bán hàng cho bạn</div></div>
        <div id="gt-c3" class="gt-nhom"><div class="gt-muc">Chỉ 3 bước</div>
          <div id="gt-b1" class="gt-buoc" data-var-text="buoc-1">1. Gửi clip thô</div>
          <div id="gt-b2" class="gt-buoc" data-var-text="buoc-2">2. Duyệt kịch bản</div>
          <div id="gt-b3" class="gt-buoc" data-var-text="buoc-3">3. Nhận video sau 2 ngày</div></div>
        <div id="gt-c4" class="gt-nhom"><div class="gt-muc">Đã làm được</div><div class="gt-lon" data-var-text="bang-chung">120 video đã giao</div></div>
        <div id="gt-c5" class="gt-nhom"><div class="gt-lon" data-var-text="ten">Edit with Tan</div></div>
      </div>
    </div>
    <script>
      // 5 canh: 0 / 1,3 / 2,5 / 4,6 / 6 s (canh 3 buoc dai nhat, 2,1 s). Moi canh: thanh cam doi do dai (scaleX) truoc, chu vao sau 0,1 s;
      // chu ra (0,2 s) xong roi canh sau moi vao, nen khong bao gio hai dong chu chong nhau. Canh cuoi giu 2 s.
      const tl = gsap.timeline({ paused: true });
      const canh = [["#gt-c1", 0, 0.55], ["#gt-c2", 1.3, 0.75], ["#gt-c3", 2.5, 0.35], ["#gt-c4", 4.6, 0.9], ["#gt-c5", 6.0, 0.25]];
      tl.fromTo("#gt-nhan", { scaleX: 0 }, { scaleX: canh[0][2], duration: 0.3, ease: "power3.out" }, 0);
      canh.forEach(([id, t, dai], i) => {
        if (i > 0) tl.to("#gt-nhan", { scaleX: dai, duration: 0.3, ease: "back.out(1.4)" }, t);
        tl.fromTo(id, { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power3.out" }, t + 0.1);
        if (i < canh.length - 1) tl.to(id, { y: -30, opacity: 0, duration: 0.2, ease: "power2.in" }, canh[i + 1][1] - 0.22);
      });
      tl.fromTo(".gt-buoc", { x: -60, opacity: 0 }, { x: 0, opacity: 1, duration: 0.25, ease: "power3.out", stagger: 0.3 }, 2.65)
        .to("#gt-nhan", { x: 360, duration: 0.3, ease: "power3.out" }, 6.0)
        .fromTo("#gt-c5 .gt-lon", { scale: 0.92 }, { scale: 1, duration: 0.4, ease: "back.out(1.6)" }, 6.1);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
