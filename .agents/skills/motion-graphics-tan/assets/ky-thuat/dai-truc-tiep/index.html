<!doctype html>
<html lang="vi" data-resolution="landscape"
  data-composition-variables='[{"id": "nhan", "type": "string", "label": "Nhãn", "default": "TRỰC TIẾP"}, {"id": "noi", "type": "string", "label": "Nơi", "default": "Hội trường UBND xã An Thạnh Thủy"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: 'Montserrat VN'; font-style: normal; font-weight: 400 900; src: url('assets/fonts/montserrat-vn-normal-vietnamese.woff2') format('woff2'); unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB; }
      @font-face { font-family: 'Montserrat VN'; font-style: normal; font-weight: 400 900; src: url('assets/fonts/montserrat-vn-normal-latin-ext.woff2') format('woff2'); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF; }
      @font-face { font-family: 'Montserrat VN'; font-style: normal; font-weight: 400 900; src: url('assets/fonts/montserrat-vn-normal-latin.woff2') format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
      /* Nhan TRUC TIEP / PHAT LAI goc tren trai: cham do nhap nhay (so lan co dinh) + noi phat. Phat lai: doi chu nhan thanh PHAT LAI. */
      :root { --nen: #8a8f96; --navy: #00164E; --navy2: #0A3C92; --vang: #FFCD2D; --trang: #ffffff; --den: #0b0f1a; --do: #CE2027; --xanh: #007A3D; --lam: #1A3CAA; --font: 'Montserrat VN', sans-serif; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--nen); }
      #root { position: relative; width: 100%; height: 100%; font-family: var(--font); }
      #tt4 { position: absolute; left: 100px; top: 60px; height: 64px; display: flex; align-items: stretch; }
      #tt4-nhan-hop { padding: 0 22px 0 18px; display: flex; align-items: center; gap: 14px; background: var(--do); }
      #tt4-cham { width: 20px; height: 20px; border-radius: 10px; background: var(--trang); }
      #tt4-nhan { font-size: 32px; font-weight: 900; color: var(--trang); white-space: nowrap; }
      #tt4-noi { padding: 0 22px; display: flex; align-items: center; background: rgba(11,15,26,0.82); font-size: 28px; font-weight: 700; color: var(--trang); white-space: nowrap; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <div id="tt4" class="clip" data-start="0" data-track-index="1" data-duration="6">
        <div id="tt4-nhan-hop"><div id="tt4-cham"></div><div id="tt4-nhan" data-var-text="nhan">TRỰC TIẾP</div></div>
        <div id="tt4-noi" data-var-text="noi">Hội trường UBND xã An Thạnh Thủy</div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#tt4-nhan-hop", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.3, ease: "power3.out" }, 0.05)
        .fromTo("#tt4-noi", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.35, ease: "power3.out" }, 0.3)
        .to("#tt4-cham", { opacity: 0.2, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 9 }, 0.5)
        .to("#tt4", { opacity: 0, duration: 0.3 }, 5.65);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
