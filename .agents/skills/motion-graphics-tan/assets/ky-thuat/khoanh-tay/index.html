<!doctype html>
<html lang="vi" data-resolution="portrait"
  data-composition-variables='[{"id":"nut","type":"string","label":"Chữ trên nút được khoanh","default":"Đăng video"},{"id":"ghi-chu","type":"string","label":"Ghi chú viết tay","default":"bấm vào đây"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: 'Montserrat VN'; font-style: italic; font-weight: 400 900; src: url('assets/fonts/montserrat-vn-italic-vietnamese.woff2') format('woff2'); unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB; }
      @font-face { font-family: 'Montserrat VN'; font-style: italic; font-weight: 400 900; src: url('assets/fonts/montserrat-vn-italic-latin-ext.woff2') format('woff2'); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF; }
      @font-face { font-family: 'Montserrat VN'; font-style: italic; font-weight: 400 900; src: url('assets/fonts/montserrat-vn-italic-latin.woff2') format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
      @font-face { font-family: 'Montserrat VN'; font-style: normal; font-weight: 400 900; src: url('assets/fonts/montserrat-vn-normal-vietnamese.woff2') format('woff2'); unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB; }
      @font-face { font-family: 'Montserrat VN'; font-style: normal; font-weight: 400 900; src: url('assets/fonts/montserrat-vn-normal-latin-ext.woff2') format('woff2'); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF; }
      @font-face { font-family: 'Montserrat VN'; font-style: normal; font-weight: 400 900; src: url('assets/fonts/montserrat-vn-normal-latin.woff2') format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
      @font-face { font-family: 'Patrick Hand VN'; font-style: normal; font-weight: 400; src: url('assets/fonts/patrick-hand-vn-normal-vietnamese.woff2') format('woff2'); unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB; }
      @font-face { font-family: 'Patrick Hand VN'; font-style: normal; font-weight: 400; src: url('assets/fonts/patrick-hand-vn-normal-latin-ext.woff2') format('woff2'); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF; }
      @font-face { font-family: 'Patrick Hand VN'; font-style: normal; font-weight: 400; src: url('assets/fonts/patrick-hand-vn-normal-latin.woff2') format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
      /* Khoanh do ve tay: net khoanh tu ve ra quanh cho can bam + mui ten + ghi chu viet tay. Dat len canh quay man hinh.
         Hoc tu Hong Phuong (quay man hinh bang dien thoai, khoanh do). Thay #kh-man bang clip that. */
      :root { --nen: #8a8f96; --man: #f4f6f7; --thanh: #d6dde0; --nut-nen: #1f9e8f; --do: #e53935; --muc: #14191c;
        --font: 'Montserrat VN', sans-serif; --font-tay: 'Patrick Hand VN', cursive; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--nen); }
      #root { position: relative; width: 100%; height: 100%; font-family: var(--font); }
      #kh-khoi { position: absolute; left: 70px; top: 200px; width: 940px; height: 900px; }
      #kh-man { position: absolute; inset: 0; border-radius: 28px; background: var(--man); }
      .kh-dong { position: absolute; left: 60px; height: 34px; border-radius: 17px; background: var(--thanh); }
      #kh-nut { position: absolute; left: 300px; top: 560px; width: 340px; height: 110px; border-radius: 55px; background: var(--nut-nen);
        display: flex; align-items: center; justify-content: center; font-size: 44px; font-weight: 800; color: #fff; }
      #kh-svg { position: absolute; left: 0; top: 0; width: 940px; height: 900px; overflow: visible; }
      #kh-ghi { position: absolute; left: 600px; top: 330px; font-family: var(--font-tay); font-size: 72px; color: var(--do);
        transform: rotate(-6deg); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1080" data-height="1920">
      <div id="kh-khoi" class="clip" data-start="0" data-duration="3" data-track-index="1">
        <div id="kh-man">
          <div class="kh-dong" style="top: 80px; width: 640px"></div>
          <div class="kh-dong" style="top: 150px; width: 800px"></div>
          <div class="kh-dong" style="top: 220px; width: 520px"></div>
          <div class="kh-dong" style="top: 760px; width: 700px"></div>
        </div>
        <div id="kh-nut" data-var-text="nut">Đăng video</div>
        <svg id="kh-svg" viewBox="0 0 940 900">
          <path id="kh-vong" d="M 470 535 C 690 520 720 600 690 660 C 650 720 330 720 260 665 C 200 615 260 540 450 532 C 520 530 560 545 580 560"
            fill="none" stroke="#e53935" stroke-width="12" stroke-linecap="round" />
          <path id="kh-ten" d="M 700 440 C 690 480 680 505 668 530 M 668 530 L 640 505 M 668 530 L 690 498"
            fill="none" stroke="#e53935" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <div id="kh-ghi" data-var-text="ghi-chu">bấm vào đây</div>
      </div>
    </div>
    <script>
      // Net khoanh ve trong 0,45 s (strokeDashoffset), mui ten ve tiep, ghi chu hien sau. Net hoi le ra ngoai nhu ve tay that.
      const tl = gsap.timeline({ paused: true });
      const vong = document.querySelector("#kh-vong"), ten = document.querySelector("#kh-ten");
      const dv = vong.getTotalLength(), dt = ten.getTotalLength();
      // Dau tron cua net van hien 1 cham khi chua ve -> an han net toi luc bat dau ve.
      gsap.set(vong, { strokeDasharray: dv, opacity: 0 }); gsap.set(ten, { strokeDasharray: dt, opacity: 0 });
      tl.fromTo("#kh-khoi", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "none" }, 0)
        .set(vong, { opacity: 1 }, 0.5).set(ten, { opacity: 1 }, 0.95)
        .fromTo(vong, { strokeDashoffset: dv }, { strokeDashoffset: 0, duration: 0.45, ease: "power1.inOut" }, 0.5)
        .fromTo(ten, { strokeDashoffset: dt }, { strokeDashoffset: 0, duration: 0.25, ease: "power1.out" }, 0.95)
        .fromTo("#kh-ghi", { opacity: 0, y: -16 }, { opacity: 1, y: 0, duration: 0.25, ease: "power2.out" }, 1.1)
        .to("#kh-nut", { scale: 1.06, duration: 0.15, ease: "power1.inOut", yoyo: true, repeat: 1 }, 1.4);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
