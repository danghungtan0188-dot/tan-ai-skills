<!doctype html>
<html lang="vi" data-resolution="portrait"
  data-composition-variables='[{"id":"tieu-de","type":"string","label":"Tiêu đề","default":"Công thức trà sữa nhà làm"},{"id":"tp-1","type":"string","label":"Thành phần 1 + định lượng","default":"Trà đen · 200 ml"},{"id":"tp-2","type":"string","label":"Thành phần 2 + định lượng","default":"Sữa tươi · 80 ml"},{"id":"tp-3","type":"string","label":"Thành phần 3 + định lượng","default":"Trân châu · 2 muỗng"},{"id":"ket-qua","type":"string","label":"Dòng kết quả","default":"Xong trong 5 phút!"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: 'Montserrat VN'; font-style: italic; font-weight: 400 900; src: url('assets/fonts/montserrat-vn-italic-vietnamese.woff2') format('woff2'); unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB; }
      @font-face { font-family: 'Montserrat VN'; font-style: italic; font-weight: 400 900; src: url('assets/fonts/montserrat-vn-italic-latin-ext.woff2') format('woff2'); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF; }
      @font-face { font-family: 'Montserrat VN'; font-style: italic; font-weight: 400 900; src: url('assets/fonts/montserrat-vn-italic-latin.woff2') format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
      @font-face { font-family: 'Montserrat VN'; font-style: normal; font-weight: 400 900; src: url('assets/fonts/montserrat-vn-normal-vietnamese.woff2') format('woff2'); unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB; }
      @font-face { font-family: 'Montserrat VN'; font-style: normal; font-weight: 400 900; src: url('assets/fonts/montserrat-vn-normal-latin-ext.woff2') format('woff2'); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF; }
      @font-face { font-family: 'Montserrat VN'; font-style: normal; font-weight: 400 900; src: url('assets/fonts/montserrat-vn-normal-latin.woff2') format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
      /* Cong thuc tung buoc: ly rong, moi thanh phan vao mot lop kem dinh luong, cuoi cung thay thanh pham.
         Dung cho mon an, my pham, quy trinh "bo vao -> ra ket qua".
         Hoc cach lam tu prompt cong thuc pha che trong awesome-opus5-5-videos (references/hoc-tu-prompt-opus.md). */
      :root { --nen: #8a8f96; --the: #1c1712; --trang: #f7f1e8; --cam: #ffb347; --l1: #6b3e1f; --l2: #e9d8bf; --l3: #2a1a10; --font: 'Montserrat VN', sans-serif; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--nen); }
      #root { position: relative; width: 100%; height: 100%; font-family: var(--font); }
      #ct-the { position: absolute; left: 60px; top: 220px; width: 960px; height: 900px; border-radius: 40px; background: var(--the); }
      #ct-tieu-de { position: absolute; left: 60px; right: 60px; top: 60px; font-size: 54px; font-weight: 800; color: var(--trang); }
      #ct-ly { position: absolute; left: 80px; top: 230px; width: 300px; height: 520px; border: 8px solid var(--trang); border-top: none;
        border-radius: 0 0 50px 50px; overflow: hidden; }
      .ct-lop { position: absolute; left: 0; right: 0; transform-origin: bottom center; }
      #ct-lop-3 { bottom: 0; height: 90px; background: var(--l3); }
      #ct-lop-1 { bottom: 90px; height: 250px; background: var(--l1); }
      #ct-lop-2 { bottom: 340px; height: 110px; background: var(--l2); }
      .ct-tp { position: absolute; left: 420px; right: 40px; white-space: nowrap; font-size: 42px; font-weight: 700; color: var(--trang); opacity: 0; }
      #ct-tp-1 { top: 510px; } #ct-tp-2 { top: 330px; } #ct-tp-3 { top: 680px; } /* ngang giua lop tuong ung */
      .ct-tp::before { content: ""; display: inline-block; width: 22px; height: 22px; border-radius: 50%; margin-right: 18px; vertical-align: middle; }
      #ct-tp-1::before { background: var(--cam); } #ct-tp-2::before { background: var(--l2); } #ct-tp-3::before { background: var(--cam); }
      #ct-ket-qua { position: absolute; left: 60px; right: 60px; top: 790px; text-align: center; font-size: 64px; line-height: 1.15; font-weight: 900; color: var(--cam); opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1080" data-height="1920">
      <div id="ct-the" class="clip" data-start="0" data-duration="5" data-track-index="1">
        <div id="ct-tieu-de" data-var-text="tieu-de">Công thức trà sữa nhà làm</div>
        <div id="ct-ly"><div id="ct-lop-3" class="ct-lop"></div><div id="ct-lop-1" class="ct-lop"></div><div id="ct-lop-2" class="ct-lop"></div></div>
        <div id="ct-tp-3" class="ct-tp" data-var-text="tp-3">Trân châu · 2 muỗng</div>
        <div id="ct-tp-1" class="ct-tp" data-var-text="tp-1">Trà đen · 200 ml</div>
        <div id="ct-tp-2" class="ct-tp" data-var-text="tp-2">Sữa tươi · 80 ml</div>
        <div id="ct-ket-qua" data-var-text="ket-qua">Xong trong 5 phút!</div>
      </div>
    </div>
    <script>
      // Thu tu do vao: day (tran chau) 0,5 s -> tra 1,2 s -> sua 1,9 s; moi lop dang len bang scaleY tu day ly,
      // nhan dinh luong truot vao cung luc. Ly day thi nay nhe, dong ket qua vao luc 2,8 s va giu toi het (2,2 s).
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#ct-the", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power3.out" }, 0)
        .fromTo("#ct-tieu-de", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "none" }, 0.15)
        .set(".ct-lop", { scaleY: 0 }, 0);
      [["#ct-lop-3", "#ct-tp-3", 0.5], ["#ct-lop-1", "#ct-tp-1", 1.2], ["#ct-lop-2", "#ct-tp-2", 1.9]].forEach(([lop, tp, t]) => {
        tl.to(lop, { scaleY: 1, duration: 0.5, ease: "power2.out" }, t)
          .fromTo(tp, { x: 60, opacity: 0 }, { x: 0, opacity: 1, duration: 0.25, ease: "power3.out" }, t);
      });
      tl.to("#ct-ly", { scale: 1.05, duration: 0.15, ease: "power1.out", yoyo: true, repeat: 1 }, 2.5)
        .fromTo("#ct-ket-qua", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "back.out(1.6)" }, 2.8);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
