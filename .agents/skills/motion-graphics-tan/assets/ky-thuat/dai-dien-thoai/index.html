<!doctype html>
<html lang="vi" data-resolution="landscape"
  data-composition-variables='[{"id": "nhan", "type": "string", "label": "Nhãn", "default": "PHỎNG VẤN QUA ĐIỆN THOẠI"}, {"id": "ten", "type": "string", "label": "Tên", "default": "Bà Trần Thị Hoa"}, {"id": "chuc-danh", "type": "string", "label": "Chức danh", "default": "Chủ vườn dưa lưới, xã An Thạnh Thủy"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: 'Montserrat VN'; font-style: normal; font-weight: 400 900; src: url('assets/fonts/montserrat-vn-normal-vietnamese.woff2') format('woff2'); unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB; }
      @font-face { font-family: 'Montserrat VN'; font-style: normal; font-weight: 400 900; src: url('assets/fonts/montserrat-vn-normal-latin-ext.woff2') format('woff2'); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF; }
      @font-face { font-family: 'Montserrat VN'; font-style: normal; font-weight: 400 900; src: url('assets/fonts/montserrat-vn-normal-latin.woff2') format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
      /* Phong van qua dien thoai: o anh tron (dat anh that khi dung), may dien thoai ve bang CSS, 7 cot song am nhay. */
      :root { --nen: #8a8f96; --navy: #00164E; --navy2: #0A3C92; --vang: #FFCD2D; --trang: #ffffff; --den: #0b0f1a; --do: #CE2027; --xanh: #007A3D; --lam: #1A3CAA; --font: 'Montserrat VN', sans-serif; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--nen); }
      #root { position: relative; width: 100%; height: 100%; font-family: var(--font); }
      #dt2 { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; background: radial-gradient(ellipse at 35% 50%, var(--navy2) 0%, var(--navy) 70%); }
      #dt2-anh { position: absolute; left: 260px; top: 280px; width: 440px; height: 440px; border-radius: 220px; border: 8px solid var(--vang);
        background: rgba(255,255,255,0.12); display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: 700; color: rgba(255,255,255,0.75); }
      #dt2-may { position: absolute; left: 610px; top: 610px; width: 110px; height: 110px; border-radius: 55px; background: var(--do); display: flex; align-items: center; justify-content: center; }
      #dt2-may-than { width: 34px; height: 58px; border-radius: 8px; border: 6px solid var(--trang); }
      #dt2-nhan { position: absolute; left: 820px; top: 330px; font-size: 38px; font-weight: 900; color: var(--vang); white-space: nowrap; }
      #dt2-ten { position: absolute; left: 820px; top: 400px; font-size: 70px; font-weight: 900; color: var(--trang); white-space: nowrap; }
      #dt2-cd { position: absolute; left: 820px; top: 500px; font-size: 38px; font-weight: 600; color: var(--trang); white-space: nowrap; }
      #dt2-song { position: absolute; left: 820px; top: 600px; height: 90px; display: flex; align-items: center; gap: 14px; }
      .dt2-cot { width: 14px; height: 60px; border-radius: 7px; background: var(--vang); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <div id="dt2" class="clip" data-start="0" data-track-index="1" data-duration="6">
        <div id="dt2-anh">Ảnh người nói</div>
        <div id="dt2-may"><div id="dt2-may-than"></div></div>
        <div id="dt2-nhan" data-var-text="nhan">PHỎNG VẤN QUA ĐIỆN THOẠI</div>
        <div id="dt2-ten" data-var-text="ten">Bà Trần Thị Hoa</div>
        <div id="dt2-cd" data-var-text="chuc-danh">Chủ vườn dưa lưới, xã An Thạnh Thủy</div>
        <div id="dt2-song"><div class="dt2-cot"></div><div class="dt2-cot"></div><div class="dt2-cot"></div><div class="dt2-cot"></div><div class="dt2-cot"></div><div class="dt2-cot"></div><div class="dt2-cot"></div></div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#dt2", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0)
        .fromTo("#dt2-anh", { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: "back.out(1.6)" }, 0.1)
        .fromTo("#dt2-may", { scale: 0 }, { scale: 1, duration: 0.3, ease: "back.out(2.5)" }, 0.45)
        .to("#dt2-may", { rotation: 12, duration: 0.08, yoyo: true, repeat: 5 }, 0.8)
        .fromTo(["#dt2-nhan", "#dt2-ten", "#dt2-cd"], { x: 60, opacity: 0 }, { x: 0, opacity: 1, duration: 0.35, ease: "power3.out", stagger: 0.12 }, 0.5)
        .fromTo(".dt2-cot", { scaleY: 0.3 }, { scaleY: 1.3, duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: 15, stagger: 0.07 }, 1.0)
        .to("#dt2", { opacity: 0, duration: 0.35 }, 5.65);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
