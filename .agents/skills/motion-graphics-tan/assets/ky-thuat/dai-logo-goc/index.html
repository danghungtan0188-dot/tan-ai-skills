<!doctype html>
<html lang="vi" data-resolution="landscape"
  data-composition-variables='[{"id": "ten-ban-tin", "type": "string", "label": "Tên bản tin", "default": "BẢN TIN NÔNG THÔN"}, {"id": "gio", "type": "string", "label": "Giờ", "default": "19:10"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: 'Montserrat VN'; font-style: normal; font-weight: 400 900; src: url('assets/fonts/montserrat-vn-normal-vietnamese.woff2') format('woff2'); unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB; }
      @font-face { font-family: 'Montserrat VN'; font-style: normal; font-weight: 400 900; src: url('assets/fonts/montserrat-vn-normal-latin-ext.woff2') format('woff2'); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF; }
      @font-face { font-family: 'Montserrat VN'; font-style: normal; font-weight: 400 900; src: url('assets/fonts/montserrat-vn-normal-latin.woff2') format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
      /* Logo goc tren phai (bug): vao 0,6 s, vet sang luot qua o 1,6 s roi dung yen. */
      :root { --nen: #8a8f96; --navy: #00164E; --navy2: #0A3C92; --vang: #FFCD2D; --trang: #ffffff; --den: #0b0f1a; --do: #CE2027; --xanh: #007A3D; --lam: #1A3CAA; --font: 'Montserrat VN', sans-serif; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--nen); }
      #root { position: relative; width: 100%; height: 100%; font-family: var(--font); }
      #lg { position: absolute; right: 100px; top: 60px; width: 420px; height: 170px; }
      #lg-o { position: absolute; right: 0; top: 0; width: 420px; height: 104px; display: flex; overflow: hidden; border-radius: 12px; }
      #lg-att { width: 230px; height: 104px; background: var(--trang); display: flex; align-items: center; justify-content: center; gap: 4px; }
      .lg-c { font-size: 66px; font-weight: 900; line-height: 1; }
      #lg-a { color: var(--do); } #lg-t1 { color: var(--xanh); } #lg-t2 { color: var(--lam); }
      #lg-news { width: 190px; height: 104px; background: var(--navy); display: flex; align-items: center; justify-content: center;
        font-size: 52px; font-weight: 900; color: var(--trang); }
      #lg-sang { position: absolute; top: -40px; left: -160px; width: 110px; height: 190px;
        background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.75) 50%, rgba(255,255,255,0) 100%); transform: rotate(20deg); }
      #lg-duoi { position: absolute; right: 0; top: 112px; height: 50px; padding: 0 18px; display: flex; align-items: center; gap: 16px;
        background: var(--den); border-radius: 8px; }
      #lg-ten { font-size: 26px; font-weight: 800; color: var(--trang); white-space: nowrap; }
      #lg-gio { font-size: 26px; font-weight: 800; color: var(--vang); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4" data-width="1920" data-height="1080">
      <div id="lg" class="clip" data-start="0" data-duration="4" data-track-index="1">
        <div id="lg-o">
          <div id="lg-att"><span class="lg-c" id="lg-a">A</span><span class="lg-c" id="lg-t1">T</span><span class="lg-c" id="lg-t2">T</span></div>
          <div id="lg-news">NEWS</div>
          <div id="lg-sang"></div>
        </div>
        <div id="lg-duoi"><div id="lg-ten" data-var-text="ten-ban-tin">BẢN TIN NÔNG THÔN</div><div id="lg-gio" data-var-text="gio">19:10</div></div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#lg-o", { clipPath: "inset(0 0 0 100% round 12px)" }, { clipPath: "inset(0 0 0 0% round 12px)", duration: 0.4, ease: "power3.out" }, 0.05)
        .fromTo(".lg-c", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.25, ease: "back.out(2)", stagger: 0.07 }, 0.3)
        .fromTo("#lg-duoi", { y: -20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power2.out" }, 0.55)
        .fromTo("#lg-sang", { x: 0 }, { x: 640, duration: 0.6, ease: "power2.inOut" }, 1.6);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
