<!doctype html>
<html lang="vi" data-resolution="landscape"
  data-composition-variables='[{"id": "nhan", "type": "string", "label": "Nhãn", "default": "CHƯƠNG TRÌNH BẮT ĐẦU SAU"}, {"id": "ten-ct", "type": "string", "label": "Tên chương trình", "default": "BẢN TIN NÔNG THÔN"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: 'Montserrat VN'; font-style: normal; font-weight: 400 900; src: url('assets/fonts/montserrat-vn-normal-vietnamese.woff2') format('woff2'); unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB; }
      @font-face { font-family: 'Montserrat VN'; font-style: normal; font-weight: 400 900; src: url('assets/fonts/montserrat-vn-normal-latin-ext.woff2') format('woff2'); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF; }
      @font-face { font-family: 'Montserrat VN'; font-style: normal; font-weight: 400 900; src: url('assets/fonts/montserrat-vn-normal-latin.woff2') format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
      /* Dem nguoc 7 -> 0 giay: so cap nhat theo thoi gian timeline (tua duoc), vong tron rut dan. */
      :root { --nen: #8a8f96; --navy: #00164E; --navy2: #0A3C92; --vang: #FFCD2D; --trang: #ffffff; --den: #0b0f1a; --do: #CE2027; --xanh: #007A3D; --lam: #1A3CAA; --font: 'Montserrat VN', sans-serif; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--nen); }
      #root { position: relative; width: 100%; height: 100%; font-family: var(--font); }
      #dn { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; background: radial-gradient(ellipse at 50% 45%, var(--navy2) 0%, var(--navy) 65%, #000818 100%); }
      #dn-nhan { position: absolute; left: 0; right: 0; top: 150px; text-align: center; font-size: 46px; font-weight: 800; color: var(--trang); }
      #dn-vong { position: absolute; left: 710px; top: 250px; }
      #dn-so { position: absolute; left: 0; right: 0; top: 430px; text-align: center; font-size: 130px; line-height: 1; font-weight: 900; color: var(--trang); }
      #dn-ten { position: absolute; left: 0; right: 0; top: 820px; text-align: center; font-size: 64px; font-weight: 900; color: var(--vang); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="8" data-width="1920" data-height="1080">
      <div id="dn" class="clip" data-start="0" data-track-index="1" data-duration="8">
        <div id="dn-nhan" data-var-text="nhan">CHƯƠNG TRÌNH BẮT ĐẦU SAU</div>
        <svg id="dn-vong" width="500" height="500" viewBox="0 0 500 500">
          <circle cx="250" cy="250" r="220" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="18"/>
          <circle id="dn-cung" cx="250" cy="250" r="220" fill="none" stroke="#FFCD2D" stroke-width="18" stroke-linecap="butt"
            transform="rotate(-90 250 250)" stroke-dasharray="1382.3" stroke-dashoffset="0"/>
        </svg>
        <div id="dn-so">00:07</div>
        <div id="dn-ten" data-var-text="ten-ct">BẢN TIN NÔNG THÔN</div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const dem = { v: 7 };
      const hien = () => { document.querySelector("#dn-so").textContent = "00:0" + Math.max(0, Math.ceil(dem.v - 0.0001)); };
      tl.fromTo("#dn", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0)
        .fromTo(dem, { v: 7 }, { v: 0, duration: 7, ease: "none", onUpdate: hien }, 0.5)
        .fromTo("#dn-cung", { strokeDashoffset: 0 }, { strokeDashoffset: 1382.3, duration: 7, ease: "none" }, 0.5)
        .fromTo("#dn-ten", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4 }, 0.3);
      hien();
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
