<!doctype html>
<html lang="vi" data-resolution="portrait"

  <head>

    <style>

      @font-face { font-family: 'Montserrat VN'; font-style: italic; font-weight: 400 900; src: url('assets/fonts/montserrat-vn-italic-latin-ext.woff2') format('woff2'); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF; }
      @font-face { font-family: 'Montserrat VN'; font-style: italic; font-weight: 400 900; src: url('assets/fonts/montserrat-vn-italic-latin.woff2') format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }

      @font-face { font-family: 'Montserrat VN'; font-style: normal; font-weight: 400 900; src: url('assets/fonts/montserrat-vn-normal-latin-ext.woff2') format('woff2'); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF; }
      @font-face { font-family: 'Montserrat VN'; font-style: normal; font-weight: 400 900; src: url('assets/fonts/montserrat-vn-normal-latin.woff2') format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
      /* The giao dien + con tro gia: dung lai giao dien bang the (sach, khong lo thong tin rieng), chu duoc go,
         con tro chuot di toi nut va bam, ket qua hien ra. Hoc cach lam (Ngo Bang AI), mau la cua minh. */
      :root { --nen: #8a8f96; --the: #1f2427; --o: #2b3236; --chu: #f3f5f6; --mo: #9aa6ab; --nut-nen: #ffb347; --muc: #1b1b1b;
        --xanh: #4cd18a; --font: 'Montserrat VN', sans-serif; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--nen); }
      #root { position: relative; width: 100%; height: 100%; font-family: var(--font); }
      #ct-the { position: absolute; left: 90px; top: 300px; width: 900px; height: 620px; border-radius: 36px; background: var(--the); }
      #ct-hoi { position: absolute; left: 60px; top: 60px; font-size: 54px; font-weight: 800; color: var(--chu); }
      #ct-o { position: absolute; left: 60px; right: 60px; top: 180px; height: 130px; border-radius: 24px; background: var(--o); }
      #ct-go { position: absolute; left: 34px; top: 38px; font-size: 46px; font-weight: 600; color: var(--chu); white-space: nowrap; }
      #ct-nut { position: absolute; right: 60px; top: 360px; width: 260px; height: 110px; border-radius: 55px; background: var(--nut-nen);
        display: flex; align-items: center; justify-content: center; font-size: 48px; font-weight: 900; color: var(--muc); }
      #ct-kq { position: absolute; left: 60px; top: 520px; font-size: 46px; font-weight: 800; color: var(--xanh); }
      #ct-tro { position: absolute; left: 0; top: 0; width: 70px; height: 90px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.5" data-width="1080" data-height="1920">
      <div id="ct-the" class="clip" data-start="0" data-duration="4.5" data-track-index="1">
        <div id="ct-hoi" data-var-text="cau-hoi">Bạn muốn làm video gì?</div>
        <div id="ct-o"><div id="ct-go" data-var-text="go">Video bán xoài 30 giây</div></div>
        <div id="ct-nut" data-var-text="nut">Gửi</div>
        <div id="ct-kq" data-var-text="ket-qua">✓ Đã nhận yêu cầu</div>
        <svg id="ct-tro" viewBox="0 0 70 90"><path d="M 6 4 L 6 74 L 24 58 L 36 86 L 48 80 L 36 53 L 60 53 Z" fill="#ffffff" stroke="#111111" stroke-width="5" stroke-linejoin="round" /></svg>
      </div>
    </div>
    <script>
      // Go chu theo buoc (clip-path, 18 buoc ~ 1 s), con tro truot toi nut (power2.inOut), bam: nut lun 0,92 roi bat lai, ket qua hien.
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#ct-the", { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power3.out" }, 0)
        .fromTo("#ct-go", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 1.0, ease: "steps(18)" }, 0.4)
        .fromTo("#ct-tro", { x: 760, y: 560, opacity: 0 }, { x: 760, y: 560, opacity: 1, duration: 0.15, ease: "none" }, 1.3)
        .to("#ct-tro", { x: 740, y: 420, duration: 0.6, ease: "power2.inOut" }, 1.5)
        .to("#ct-nut", { scale: 0.92, duration: 0.08, ease: "power1.in" }, 2.15)
        .to("#ct-tro", { scale: 0.85, duration: 0.08, ease: "power1.in" }, 2.15)
        .to(["#ct-nut", "#ct-tro"], { scale: 1, duration: 0.2, ease: "back.out(3)" }, 2.23)
        .fromTo("#ct-kq", { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.25, ease: "power2.out" }, 2.35);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
