  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1080" data-height="1920">
      <div id="sy-the" class="clip" data-start="0" data-duration="3" data-track-index="1">
        <div id="sy-troi">
          <div id="sy-s1" class="sy-soc"></div><div id="sy-s2" class="sy-soc"></div>
          <div id="sy-s3" class="sy-soc"></div>

        <div id="sy-tieu-de" data-var-text="tieu-de">ĐÊM NHẠC</div>
        <div id="sy-phu" data-var-text="phu">Thứ Bảy · 20 giờ</div>
      </div>
    </div>
    <script>
      // Chu ky chuyen dong: luoi chay deu ve phia nguoi xem (ease none, dung boi so o luoi), mat troi moc, chu neon bat sang.
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#sy-the", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "none" }, 0)
        .fromTo("#sy-luoi", { y: 0 }, { y: 144, duration: 3, ease: "none" }, 0)
        .fromTo("#sy-troi", { y: 320 }, { y: 0, duration: 1.0, ease: "power2.out" }, 0.05)
        .fromTo("#sy-tieu-de", { scale: 1.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" }, 0.55)
        .to("#sy-tieu-de", { opacity: 0.55, duration: 0.05, ease: "none" }, 1.0)
        .to("#sy-tieu-de", { opacity: 1, duration: 0.05, ease: "none" }, 1.08)
        .fromTo("#sy-phu", { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power2.out" }, 0.95)
        .to("#sy-the", { opacity: 0, duration: 0.25, ease: "none" }, 2.72);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
