<!doctype html>
<html lang="vi" data-resolution="portrait"
  data-composition-variables='[{"id":"chot","type":"string","label":"Chữ chốt","default":"NHANH HƠN"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: 'Montserrat VN'; font-style: italic; font-weight: 400 900; src: url('assets/fonts/montserrat-vn-italic-vietnamese.woff2') format('woff2'); unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB; }
      @font-face { font-family: 'Montserrat VN'; font-style: italic; font-weight: 400 900; src: url('assets/fonts/montserrat-vn-italic-latin-ext.woff2') format('woff2'); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF; }
      @font-face { font-family: 'Montserrat VN'; font-style: italic; font-weight: 400 900; src: url('assets/fonts/montserrat-vn-italic-latin.woff2') format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
      @font-face { font-family: 'Montserrat VN'; font-style: normal; font-weight: 400 900; src: url('assets/fonts/montserrat-vn-normal-vietnamese.woff2') format('woff2'); unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB; }
      @font-face { font-family: 'Montserrat VN'; font-style: normal; font-weight: 400 900; src: url('assets/fonts/montserrat-vn-normal-latin-ext.woff2') format('woff2'); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF; }
      @font-face { font-family: 'Montserrat VN'; font-style: normal; font-weight: 400 900; src: url('assets/fonts/montserrat-vn-normal-latin.woff2') format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
      /* Kinetic Type: chu la hinh anh. Cac hang chu lap, dac xen rong ruot, troi nguoc chieu, roi mot chu chot dap vao. */
      :root { --nen: #8a8f96; --den: #0a0a0a; --trang: #f5f5f0; --nhan: #ff3b30; --font: 'Montserrat VN', sans-serif; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--nen); }
      #root { position: relative; width: 100%; height: 100%; font-family: var(--font); }
      #kt-the { position: absolute; left: 140px; top: 170px; width: 800px; height: 1000px; background: var(--den);
        overflow: hidden; border-radius: 6px; }
      .kt-hang { position: absolute; left: -400px; white-space: nowrap; font-size: 120px; font-weight: 900;
        letter-spacing: -0.03em; line-height: 1; }
      .kt-dac { color: var(--trang); }
      .kt-rong { color: transparent; -webkit-text-stroke: 3px var(--trang); }
      #kt-h1 { top: 60px; } #kt-h2 { top: 190px; } #kt-h3 { top: 320px; } #kt-h4 { top: 580px; }
      #kt-h5 { top: 710px; } #kt-h6 { top: 840px; }
      #kt-chot { position: absolute; left: 0; right: 0; top: 440px; text-align: center; font-size: 118px; font-weight: 900;
        letter-spacing: -0.04em; line-height: 1; color: var(--nhan); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1080" data-height="1920">
      <div id="kt-the" class="clip" data-start="0" data-duration="3" data-track-index="1">
        <div id="kt-h1" class="kt-hang kt-dac">DỰNG VIDEO DỰNG VIDEO DỰNG VIDEO</div>
        <div id="kt-h2" class="kt-hang kt-rong">DỰNG VIDEO DỰNG VIDEO DỰNG VIDEO</div>
        <div id="kt-h3" class="kt-hang kt-dac">DỰNG VIDEO DỰNG VIDEO DỰNG VIDEO</div>
        <div id="kt-chot" data-var-text="chot">NHANH HƠN</div>
        <div id="kt-h4" class="kt-hang kt-dac">DỰNG VIDEO DỰNG VIDEO DỰNG VIDEO</div>
        <div id="kt-h5" class="kt-hang kt-rong">DỰNG VIDEO DỰNG VIDEO DỰNG VIDEO</div>
        <div id="kt-h6" class="kt-hang kt-dac">DỰNG VIDEO DỰNG VIDEO DỰNG VIDEO</div>
      </div>
    </div>
    <script>
      // Chu ky chuyen dong: hang chu troi deu (ease none) nguoc chieu nhau; chu chot dap vao (scale tu to ve vua, expo.out).
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#kt-the", { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "none" }, 0)
        .fromTo("#kt-h1, #kt-h3, #kt-h5", { x: -260 }, { x: 60, duration: 3, ease: "none" }, 0)
        .fromTo("#kt-h2, #kt-h4, #kt-h6", { x: 60 }, { x: -260, duration: 3, ease: "none" }, 0)
        .fromTo(".kt-hang", { opacity: 0 }, { opacity: 1, duration: 0.2, stagger: 0.05, ease: "none" }, 0.05)
        .fromTo("#kt-chot", { scale: 2.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "expo.out" }, 0.75)
        .to(".kt-hang", { opacity: 0.28, duration: 0.2, ease: "none" }, 0.75)
        .to("#kt-the", { opacity: 0, duration: 0.2, ease: "none" }, 2.75);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
