<!doctype html>
<html lang="vi" data-resolution="portrait"
  data-composition-variables='[{"id":"tieu-de","type":"string","label":"Tiêu đề","default":"Vươn ra thế giới"},{"id":"so","type":"string","label":"Con số","default":"12 quốc gia"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: 'Inter VN'; font-style: normal; font-weight: 400 900; src: url('assets/fonts/inter-vn-normal-vietnamese.woff2') format('woff2'); unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB; }
      @font-face { font-family: 'Inter VN'; font-style: normal; font-weight: 400 900; src: url('assets/fonts/inter-vn-normal-latin-ext.woff2') format('woff2'); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF; }
      @font-face { font-family: 'Inter VN'; font-style: normal; font-weight: 400 900; src: url('assets/fonts/inter-vn-normal-latin.woff2') format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
      /* Globe 3D: qua dia cau gia lap bang CSS -- mang luc dia truot ngang sau mat na tron, bong toi ben phai, quang xanh quanh vien. Khong WebGL. */
      :root { --nen: #8a8f96; --dem: #06122b; --bien: #1769c7; --dat: #3fbf7f; --quang: #58c4ff; --trang: #ffffff;
        --font: 'Inter VN', sans-serif; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--nen); }
      #root { position: relative; width: 100%; height: 100%; font-family: var(--font); }
      #gb-the { position: absolute; left: 140px; top: 170px; width: 800px; height: 1000px; overflow: hidden; background: var(--dem); border-radius: 24px; }
      #gb-quang { position: absolute; left: 130px; top: 90px; width: 540px; height: 540px; border-radius: 50%;
        box-shadow: 0 0 60px 14px var(--quang); }
      #gb-qua { position: absolute; left: 130px; top: 90px; width: 540px; height: 540px; border-radius: 50%; overflow: hidden; background: var(--bien); }
      #gb-dai { position: absolute; left: 0; top: 0; width: 2160px; height: 540px; }
      .gb-luc-dia { position: absolute; background: var(--dat); }
      #gb-a1 { left: 40px; top: 90px; width: 190px; height: 150px; border-radius: 60% 40% 55% 45%; }
      #gb-a2 { left: 120px; top: 260px; width: 110px; height: 190px; border-radius: 45% 55% 60% 40%; }
      #gb-a3 { left: 340px; top: 60px; width: 230px; height: 120px; border-radius: 55% 45% 40% 60%; }
      #gb-a4 { left: 400px; top: 210px; width: 140px; height: 200px; border-radius: 50% 40% 60% 45%; }
      #gb-a5 { left: 660px; top: 120px; width: 210px; height: 170px; border-radius: 40% 60% 45% 55%; }
      #gb-a6 { left: 800px; top: 340px; width: 120px; height: 90px; border-radius: 50%; }
      #gb-b1 { left: 1120px; top: 90px; width: 190px; height: 150px; border-radius: 60% 40% 55% 45%; }
      #gb-b2 { left: 1200px; top: 260px; width: 110px; height: 190px; border-radius: 45% 55% 60% 40%; }
      #gb-b3 { left: 1420px; top: 60px; width: 230px; height: 120px; border-radius: 55% 45% 40% 60%; }
      #gb-b4 { left: 1480px; top: 210px; width: 140px; height: 200px; border-radius: 50% 40% 60% 45%; }
      #gb-b5 { left: 1740px; top: 120px; width: 210px; height: 170px; border-radius: 40% 60% 45% 55%; }
      #gb-b6 { left: 1880px; top: 340px; width: 120px; height: 90px; border-radius: 50%; }
      #gb-bong { position: absolute; inset: 0; border-radius: 50%;
        background: radial-gradient(circle at 32% 30%, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0) 38%, rgba(0, 10, 40, 0.62) 92%); }
      #gb-tieu-de { position: absolute; left: 0; right: 0; top: 690px; text-align: center; font-size: 80px; font-weight: 900;
        letter-spacing: -0.03em; color: var(--trang); }
      #gb-so { position: absolute; left: 0; right: 0; top: 800px; text-align: center; font-size: 56px; font-weight: 700; color: var(--quang); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1080" data-height="1920">
      <div id="gb-the" class="clip" data-start="0" data-duration="3" data-track-index="1">
        <div id="gb-quang"></div>
        <div id="gb-qua">
          <div id="gb-dai" data-layout-allow-overflow>
            <div id="gb-a1" class="gb-luc-dia"></div><div id="gb-a2" class="gb-luc-dia"></div><div id="gb-a3" class="gb-luc-dia"></div>
            <div id="gb-a4" class="gb-luc-dia"></div><div id="gb-a5" class="gb-luc-dia"></div><div id="gb-a6" class="gb-luc-dia"></div>
            <div id="gb-b1" class="gb-luc-dia"></div><div id="gb-b2" class="gb-luc-dia"></div><div id="gb-b3" class="gb-luc-dia"></div>
            <div id="gb-b4" class="gb-luc-dia"></div><div id="gb-b5" class="gb-luc-dia"></div><div id="gb-b6" class="gb-luc-dia"></div>
          </div>
          <div id="gb-bong"></div>
        </div>
        <div id="gb-tieu-de" data-var-text="tieu-de">Vươn ra thế giới</div>
        <div id="gb-so" data-var-text="so">12 quốc gia</div>
      </div>
    </div>
    <script>
      // Chu ky chuyen dong: qua cau quay deu (dai luc dia truot ngang, ease none), phong to em tu nho; chu hien sau.
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#gb-the", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "none" }, 0)
        .fromTo("#gb-qua, #gb-quang", { scale: 0.7 }, { scale: 1, duration: 0.9, ease: "power3.out" }, 0)
        .fromTo("#gb-dai", { x: 0 }, { x: -540, duration: 3, ease: "none" }, 0)
        .fromTo("#gb-tieu-de", { y: 36, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 0.5)
        .fromTo("#gb-so", { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 0.75)
        .to("#gb-the", { opacity: 0, duration: 0.28, ease: "none" }, 2.68);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
