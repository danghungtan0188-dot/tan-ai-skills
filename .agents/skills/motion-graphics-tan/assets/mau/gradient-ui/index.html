<!doctype html>
<html lang="vi" data-resolution="portrait"
  data-composition-variables='[{"id":"tieu-de","type":"string","label":"Tiêu đề","default":"Doanh thu tăng"},{"id":"so","type":"string","label":"Con số","default":"+38%"},{"id":"phu","type":"string","label":"Dòng phụ","default":"So với tháng trước"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: 'Inter VN'; font-style: normal; font-weight: 400 900; src: url('assets/fonts/inter-vn-normal-vietnamese.woff2') format('woff2'); unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB; }
      @font-face { font-family: 'Inter VN'; font-style: normal; font-weight: 400 900; src: url('assets/fonts/inter-vn-normal-latin-ext.woff2') format('woff2'); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF; }
      @font-face { font-family: 'Inter VN'; font-style: normal; font-weight: 400 900; src: url('assets/fonts/inter-vn-normal-latin.woff2') format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
      /* Gradient UI: nen chuyen mau tim hong, the giao dien trang bo goc, bieu do cot. Sach, hien dai, hop SaaS va bao cao so lieu. */
      :root { --nen: #8a8f96; --tim: #5b21d6; --hong: #e0359b; --cam: #ff8a4c; --trang: #ffffff; --muc: #1d1433; --xam: #6a6280;
        --font: 'Inter VN', sans-serif; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--nen); }
      #root { position: relative; width: 100%; height: 100%; font-family: var(--font); }
      #gu-the { position: absolute; left: 140px; top: 170px; width: 800px; height: 1000px; overflow: hidden; border-radius: 40px;
        background: linear-gradient(150deg, var(--tim) 0%, var(--hong) 62%, var(--cam) 100%); }
      #gu-bang { position: absolute; left: 60px; top: 110px; width: 680px; height: 780px; padding: 52px; background: var(--trang); border-radius: 36px;
        box-shadow: 0 30px 70px rgba(40, 0, 80, 0.4); color: var(--muc); }
      #gu-tieu-de { font-size: 46px; font-weight: 700; letter-spacing: -0.01em; }
      #gu-so { margin-top: 14px; font-size: 150px; font-weight: 900; line-height: 1; letter-spacing: -0.05em; color: var(--tim); }
      #gu-phu { margin-top: 18px; font-size: 34px; font-weight: 400; color: var(--xam); }
      #gu-bieu-do { position: absolute; left: 52px; right: 52px; bottom: 52px; height: 300px; }
      .gu-cot { position: absolute; bottom: 0; width: 84px; border-radius: 16px 16px 0 0; background: #dcd3f5; transform-origin: center bottom; }
      #gu-c1 { left: 0; height: 110px; } #gu-c2 { left: 118px; height: 150px; } #gu-c3 { left: 236px; height: 130px; }
      #gu-c4 { left: 354px; height: 200px; }
      #gu-c5 { left: 472px; height: 290px; background: var(--hong); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1080" data-height="1920">
      <div id="gu-the" class="clip" data-start="0" data-duration="3" data-track-index="1">
        <div id="gu-bang">
          <div id="gu-tieu-de" data-var-text="tieu-de">Doanh thu tăng</div>
          <div id="gu-so" data-var-text="so">+38%</div>
          <div id="gu-phu" data-var-text="phu">So với tháng trước</div>
          <div id="gu-bieu-do">
            <div id="gu-c1" class="gu-cot"></div><div id="gu-c2" class="gu-cot"></div><div id="gu-c3" class="gu-cot"></div>
            <div id="gu-c4" class="gu-cot"></div><div id="gu-c5" class="gu-cot"></div>
          </div>
        </div>
      </div>
    </div>
    <script>
      // Chu ky chuyen dong: sach va chac (power3.out); the truot len, chu so le, cac cot moc lan luot, cot cuoi noi bat vao sau cung.
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#gu-the", { opacity: 0, scale: 0.96 }, { opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" }, 0)
        .fromTo("#gu-bang", { y: 120, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" }, 0.1)
        .fromTo("#gu-tieu-de, #gu-so, #gu-phu", { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, stagger: 0.09, ease: "power3.out" }, 0.3)
        .fromTo(".gu-cot", { scaleY: 0 }, { scaleY: 1, duration: 0.5, stagger: 0.1, ease: "power3.out" }, 0.6)
        .to("#gu-the", { opacity: 0, y: -30, duration: 0.28, ease: "power2.in" }, 2.68);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
