<!doctype html>
<html lang="vi" data-resolution="portrait"
  data-composition-variables='[{"id":"tieu-de","type":"string","label":"Tiêu đề","default":"Dễ thương mà chuyên nghiệp"},{"id":"phu","type":"string","label":"Dòng phụ","default":"Dựng video trọn gói"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: 'Nunito VN'; font-style: normal; font-weight: 400 900; src: url('assets/fonts/nunito-vn-normal-vietnamese.woff2') format('woff2'); unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB; }
      @font-face { font-family: 'Nunito VN'; font-style: normal; font-weight: 400 900; src: url('assets/fonts/nunito-vn-normal-latin-ext.woff2') format('woff2'); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF; }
      @font-face { font-family: 'Nunito VN'; font-style: normal; font-weight: 400 900; src: url('assets/fonts/nunito-vn-normal-latin.woff2') format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
      /* Clay 3D: dat nan -- khoi tron mem, sang tren toi duoi bang bong trong, mau pastel. Dung CSS, khong WebGL, may nhe. */
      :root { --nen: #8a8f96; --hong: #f8b4c8; --kem: #fff4e6; --dao: #ff8fab; --bac-ha: #9de3cf; --chanh: #ffe07a; --chu: #5a2a3f;
        --font: 'Nunito VN', sans-serif; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--nen); }
      #root { position: relative; width: 100%; height: 100%; font-family: var(--font); }
      #cl-the { position: absolute; left: 140px; top: 170px; width: 800px; height: 1000px; overflow: hidden;
        background: var(--hong); border-radius: 70px; }
      .cl-khoi { position: absolute;
        box-shadow: inset -22px -26px 44px rgba(90, 30, 60, 0.28), inset 20px 22px 40px rgba(255, 255, 255, 0.65),
          24px 34px 50px rgba(120, 40, 80, 0.32); }
      #cl-bong { left: 80px; top: 80px; width: 300px; height: 300px; border-radius: 50%; background: var(--dao); }
      #cl-vien { left: 440px; top: 150px; width: 250px; height: 150px; border-radius: 90px; background: var(--bac-ha); }
      #cl-sao { left: 500px; top: 40px; width: 110px; height: 110px; border-radius: 50%; background: var(--chanh); }
      #cl-bang { left: 60px; top: 440px; width: 680px; height: 320px; padding: 40px 48px; border-radius: 70px; background: var(--kem); }
      #cl-tieu-de { font-size: 78px; font-weight: 900; line-height: 1.12; letter-spacing: -0.01em; color: var(--chu); }
      #cl-nut { left: 150px; top: 815px; width: 500px; height: 120px; display: flex; align-items: center; justify-content: center;
        border-radius: 70px; background: var(--dao); font-size: 42px; font-weight: 800; color: #4a1730; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1080" data-height="1920">
      <div id="cl-the" class="clip" data-start="0" data-duration="3" data-track-index="1">
        <div id="cl-bong" class="cl-khoi"></div>
        <div id="cl-vien" class="cl-khoi"></div>
        <div id="cl-sao" class="cl-khoi"></div>
        <div id="cl-bang" class="cl-khoi"><div id="cl-tieu-de" data-var-text="tieu-de">Dễ thương mà chuyên nghiệp</div></div>
        <div id="cl-nut" class="cl-khoi" data-var-text="phu">Dựng video trọn gói</div>
      </div>
    </div>
    <script>
      // Chu ky chuyen dong: bop nan -- khoi roi xuong dep ra (scaleY nho, scaleX to) roi nay lai bang elastic; moi thu mem, khong goc canh.
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#cl-the", { scale: 0.9, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: "back.out(1.8)" }, 0)
        .fromTo("#cl-bong", { y: -420 }, { y: 0, duration: 0.4, ease: "power2.in" }, 0.1)
        .fromTo("#cl-bong", { scaleX: 1.22, scaleY: 0.78 }, { scaleX: 1, scaleY: 1, duration: 0.8, ease: "elastic.out(1, 0.45)" }, 0.5)
        .fromTo("#cl-vien", { scale: 0 }, { scale: 1, duration: 0.8, ease: "elastic.out(1, 0.55)" }, 0.3)
        .fromTo("#cl-sao", { y: -200 }, { y: 0, duration: 0.7, ease: "bounce.out" }, 0.45)
        .fromTo("#cl-bang", { scale: 0.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.8, ease: "elastic.out(1, 0.6)" }, 0.5)
        .fromTo("#cl-nut", { y: 240 }, { y: 0, duration: 0.8, ease: "elastic.out(1, 0.6)" }, 0.75)
        .to("#cl-bong", { y: -14, duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: 1 }, 1.5)
        .to("#cl-the", { scale: 0.92, opacity: 0, duration: 0.26, ease: "back.in(1.6)" }, 2.7);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
